<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MEXT Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="icon" type="image/png" href="icon-192.png?v=mv63w3m5">
<link rel="manifest" href="manifest.webmanifest?v=mv63w3m5">
<link rel="apple-touch-icon" href="icon-192.png?v=mv63w3m5">
<style>
/* ===== Tema 和紙 (claro) ===== */
:root{--bg:#f6f0e4;--surface:#fffdf8;--surface2:#f2eadb;--text:#211b17;--muted:#74695e;--line:#e4d8c4;
  --accent:#d6336c;--accent2:#b07d12;--accent-t:#fff;--ok:#1d8a50;--okbg:#e2f3e8;--bad:#c9302c;--badbg:#fbe6e2;--warn:#b26b00;--warnbg:#fbefd9;--focus:#d63a2f;
  --glow:rgba(214,51,108,.16);--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --cop:#d63a2f;--inf:#2457d6;--neg:#7348d1;--unc:#1c9459;--ind:#bb7400;--c1:#0b8aa3;--mix:#211b17;--buf:#b26b00;--fos:#c23c7c;--dia:#4f46e5;--esc:#0f766e;--amar:#e3b100;--celn:#0b93c9;--amarbg:#ffe27a;--amart:#3a3000}
/* ===== Tema 夜 (oscuro) ===== */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff7aa8;--accent2:#ffc857;--accent-t:#2a0714;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,122,168,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --cop:#ff6b5e;--inf:#8fb0ff;--neg:#ad90ff;--unc:#4fe090;--ind:#ffb84d;--c1:#3cc8e6;--mix:#f2efe8;--buf:#ffb347;--fos:#ff7ab6;--dia:#a5b4fc;--esc:#5eead4;--amar:#ffd84d;--celn:#62d2ff;--amarbg:rgba(255,216,77,.18);--amart:#ffd84d}}
:root[data-theme="dark"]{--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff7aa8;--accent2:#ffc857;--accent-t:#2a0714;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,122,168,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --cop:#ff6b5e;--inf:#8fb0ff;--neg:#ad90ff;--unc:#4fe090;--ind:#ffb84d;--c1:#3cc8e6;--mix:#f2efe8;--buf:#ffb347;--fos:#ff7ab6;--dia:#a5b4fc;--esc:#5eead4;--amar:#ffd84d;--celn:#62d2ff;--amarbg:rgba(255,216,77,.18);--amart:#ffd84d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);background-color:var(--bg)}
body{font-family:"Nunito","Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100dvh;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--pat,none);background-attachment:fixed}
#app{max-width:780px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.center{text-align:center}
.hide{display:none!important}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card h3{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kbd{font-family:ui-monospace,monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* ===== Marca ===== */
.brand{display:flex;align-items:center;gap:10px}
.hanko{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:900;font-size:1.25rem;transform:rotate(-4deg);box-shadow:0 4px 14px var(--glow)}
.brand b{display:block;font-size:1.15rem;letter-spacing:.02em}
.nivel{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.06em;vertical-align:2px}
.brand small{color:var(--muted);font-size:.78rem}

/* ===== Hero ===== */
.hero{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{position:relative;flex:none;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .in b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.ring .in small{font-size:.7rem;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hero .h{font-size:1.05rem;font-weight:700;margin:4px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.viejo{opacity:.55}.pill.viejo .hace{font-weight:600}

/* ===== Botón principal ===== */
.start{position:relative;width:100%;margin-top:16px;border:0;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;
  background:linear-gradient(120deg,#f2669a,#d6336c 55%,#8e1f5a);box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.start::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.start .play{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.4rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.start b{display:block;font-size:1.3rem}
.start small{opacity:.85;font-size:.85rem}
.start:active{transform:scale(.99)}

/* ===== Mosaicos ===== */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--c)}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c),var(--shadow)}
.glyph{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.95rem;letter-spacing:-.02em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:6px;flex:none}
.mode .mn{font-weight:800;font-size:.98rem}
.mode .ms{font-size:.74rem;color:var(--muted);line-height:1.25}
.mode .acc{position:absolute;top:12px;right:12px;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.mode .mb{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.9}
.mode .badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--c);color:var(--bg);font-size:.75rem;font-weight:900;display:grid;place-items:center}

/* ===== Regla del día ===== */
.rule-day{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--c)}
.rule-day .glyph{margin:0}
.rule-day p{margin:2px 0 8px;font-size:.98rem;font-weight:600}
.rule-day .wm{position:absolute;right:-4px;bottom:-30px;font-size:6.5rem;font-weight:900;color:var(--c);opacity:.07;pointer-events:none;line-height:1}

/* ===== Medidores ===== */
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)} .meter i.none{background:var(--line)}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0;padding-top:2px}
.catrow .glyph{margin:0;grid-row:span 2}
.catrow .meter,.catrow .sub{grid-column:2/-1}
.catrow .sub{font-size:.75rem;color:var(--muted)}
.pct{font-variant-numeric:tabular-nums;font-weight:800}

/* ===== Ajustes ===== */
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details[open].card summary::after{content:"－"}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:.9rem}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}

/* ===== Drill ===== */
.hud{display:flex;align-items:center;gap:10px;position:relative}
.score{line-height:1}
.score b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.score small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.float{position:absolute;left:58px;top:-6px;font-weight:900;color:var(--accent2);font-size:1.1rem;pointer-events:none;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.combo{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:900;font-variant-numeric:tabular-nums;color:#2a1a00;background:linear-gradient(135deg,#ffe08a,#ffb547);box-shadow:0 4px 16px rgba(255,181,71,.35);animation:bump .3s}
.combo.hot{color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff3d5a);box-shadow:0 4px 20px rgba(255,61,90,.45)}
@keyframes bump{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.lives{font-weight:900;letter-spacing:2px;color:var(--bad)}
.tring{position:relative;width:48px;height:48px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.tring.low circle.fg{stroke:var(--bad)}
.tring.low span{color:var(--bad)}
.qcard{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px 0;box-shadow:var(--shadow);overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.qcard .wm{position:absolute;right:-6px;bottom:-26px;font-size:7.5rem;font-weight:900;color:var(--c);opacity:.07;pointer-events:none;line-height:1}
.qcard.pop{animation:okpulse .45s}
@keyframes okpulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 16px transparent}}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--c,var(--muted))}
.tag.buf{--c:var(--warn)}
.tag.fos{--c:var(--fos)}
.head{font-size:.84rem;color:var(--muted);text-align:center;margin-top:10px}
.prompt{position:relative;font-size:1.4rem;line-height:2.6;padding:10px 4px 22px;text-align:center;overflow-wrap:anywhere}
.prompt.rb{line-height:1.8;padding-bottom:18px}
.blank{display:inline-block;min-width:3em;color:var(--c);font-weight:800;white-space:nowrap;border-bottom:3px solid var(--c);line-height:1.2}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.segm{position:relative;border:0;background:color-mix(in srgb,var(--c) 9%,transparent);border-bottom:3px solid var(--c);border-radius:6px 6px 2px 2px;padding:0 5px;line-height:1.5;font-size:inherit;transition:background .12s}
.segm:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.segm .k{position:absolute;left:50%;transform:translateX(-50%);bottom:-1.45em;font-size:.6rem;font-weight:900;color:var(--muted);line-height:1}
.segm.ok{background:var(--okbg);border-color:var(--ok);animation:pop .35s}
.segm.ok .k{color:var(--ok)}
.segm.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.segm.bad .k{color:var(--bad)}
.segm.dim{opacity:.45}
.prompt.shake{animation:shake .38s}
.qtimer{height:5px;background:var(--surface2);margin:0 -16px}
.qtimer i{display:block;height:100%;width:100%;background:var(--ok);transition:background .3s}
.qtimer i.mid{background:var(--warn)} .qtimer i.low{background:var(--bad)}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:62px;font-size:1.15rem;line-height:1.4;box-shadow:var(--shadow);transition:transform .08s,border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:.85rem;display:grid;place-items:center;font-weight:800;transition:background .12s,color .12s}
.opt:hover .k{background:var(--c);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .35s}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.4;box-shadow:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opts.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fb{display:flex;gap:12px;margin-top:14px;border-radius:18px;padding:14px;background:var(--surface);border:1.5px solid var(--bad);box-shadow:0 8px 26px var(--badbg);animation:rise .25s ease-out;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bad);color:var(--bg);display:grid;place-items:center;font-weight:900}
.fb .h{font-size:.92rem;color:var(--muted);margin-bottom:6px}
.fb .h b{color:var(--text)}
.fb .fix{font-size:1.08rem;font-weight:600;margin:0 0 6px}
.fix ins{text-decoration:none;color:var(--ok);font-weight:800;border-bottom:2px solid var(--ok)}
.fb .r2{margin:0;color:var(--muted)}
.fb .r2 b{color:var(--text)}
.fosbox{border-radius:12px;padding:8px 10px;margin:0 0 8px;background:color-mix(in srgb,var(--fos) 13%,transparent);border:1px solid color-mix(in srgb,var(--fos) 45%,transparent)}
.fosbox b{display:block;color:var(--fos);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.fb .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--muted)}
.fb .go-on{margin-left:auto;font-weight:800;color:var(--text);background:var(--surface2);border-radius:99px;padding:6px 14px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:var(--fos);transition:opacity .35s;z-index:8}

/* ===== Final ===== */
.endhero{position:relative;text-align:center;padding:26px 16px 20px;border-radius:24px;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.stamp{width:108px;height:108px;margin:0 auto 10px;border:5px solid var(--focus);border-radius:50%;display:grid;place-items:center;color:var(--focus);font-size:3.1rem;font-weight:900;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 5px var(--focus)}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.stamp-l{font-weight:800;color:var(--focus);letter-spacing:.08em;font-size:.82rem}
.big{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted)}
.proj{display:flex;gap:12px;align-items:center;border-left:4px solid var(--c)}
.proj b{font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--c)}
.cta{display:flex;gap:10px}
.cta .start{margin-top:0;flex:2;padding:16px}
.cta .btn{flex:1;border-radius:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
.miss{padding:10px 0;border-top:1px solid var(--line)}
.miss:first-of-type{border-top:0;padding-top:0}
.miss .fix{font-weight:600;margin:0 0 3px}
.miss .r{font-size:.84rem;color:var(--muted)}

/* ===== Listas ===== */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.list li:first-child{border-top:0}
.list li .glyph{margin:0}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{letter-spacing:2px;color:var(--warn);font-size:.8rem;white-space:nowrap}

.pill[data-s]{cursor:pointer}
.pill[data-s="ok"]{color:var(--ok)}.pill[data-s="warn"]{color:var(--warn)}.pill[data-s="bad"]{color:var(--bad)}.pill[data-s="muted"]{color:var(--muted)}
.syncbox{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.syncbox label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.syncbox input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}

/* ================= STORAGE: registro de eventos =================
   Igual que MEXT Ráfaga: la fuente de verdad es DB.ev (cada respuesta 'a', cada ronda 's',
   progreso anterior a la sincronización 'b'). cats/items/buffer/sessions/best… son DERIVADOS:
   se reconstruyen reproduciendo los eventos en orden (t, i), así dos dispositivos que
   practicaron sin conexión se fusionan sin conflictos. */
const KEY="mextforge.v1";
const rid=()=>Math.random().toString(36).slice(2,10);
const isPhone=()=>typeof navigator!=="undefined"&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const fresh=()=>({v:2,dev:{id:rid(),name:isPhone()?"Teléfono":"PC"},ev:[],outbox:[],cursor:0,lastSync:0,
  settings:{speed:"warm",mute:false,theme:"auto",focus:"mix",syncUrl:"",syncKey:""}});
function derivedReset(d){d.cats={};d.items={};d.buffer={};d.sessions=[];d.fossils=0;d.best={score:0,combo:0};d.bestMode={}}
let DB=fresh();derivedReset(DB);
const cs=c=>{const s=DB.cats[c]||(DB.cats[c]={n:0,w:0,to:0,ms:0,f:0});if(!s.r)s.r=[];return s};
// Aplica un evento al estado derivado. Devuelve {freed} si sacó un ejercicio del buffer.
function applyEvent(e){
  if(e.k==="a"){
    const it=BYID[e.q],cat=it?it.c:(String(e.q).startsWith("d:")?"DIA":String(e.q).startsWith("w:")?"ESC":null);if(!cat)return{};
    const s=cs(cat),ok=!!e.o;
    s.n++;s.ms+=e.ms||0;s.r.push(ok?1:0);if(s.r.length>15)s.r.shift();
    const is=DB.items[e.q]||(DB.items[e.q]={w:0,c:0});is.n=(is.n||0)+1;if(ok)is.ok=(is.ok||0)+1;
    if(ok){is.c++;const b=DB.buffer[e.q];if(b){b.s++;if(b.s>=3){delete DB.buffer[e.q];return{freed:true}}}}
    else{s.w++;is.w++;is.c=0;if(e.to)s.to++;if(e.f){s.f++;DB.fossils++}
      const b=DB.buffer[e.q];DB.buffer[e.q]={s:0,f:(b?b.f:0)+1}}
    return{};
  }
  if(e.k==="s"){
    DB.sessions.push({d:today(new Date(e.t)),ts:e.t,m:e.m,acc:e.n?Math.round(100*e.ok/e.n):0,s:e.sc,n:e.n,ok:e.ok,dn:e.dn});
    DB.best.score=Math.max(DB.best.score,e.sc||0);DB.best.combo=Math.max(DB.best.combo,e.cb||0);
    if(e.n)DB.bestMode[e.m]=Math.max(DB.bestMode[e.m]||0,e.sc||0);
    return{};
  }
  if(e.k==="b"){ // progreso anterior a la sincronización: se SUMA al de los demás dispositivos
    const p=e.snap||{};
    for(const[c,v]of Object.entries(p.cats||{})){if(!CATS[c])continue;const st=cs(c);st.n+=v.n||0;st.w+=v.w||0;st.to+=v.to||0;st.ms+=v.ms||0;st.f+=v.f||0;st.r=st.r.concat(v.r||[]).slice(-15)}
    for(const[k,v]of Object.entries(p.items||{})){if(!BYID[k])continue;const it=DB.items[k];if(!it)DB.items[k]={w:v.w||0,c:v.c||0};else{it.w+=v.w||0;it.c=Math.max(it.c,v.c||0)}}
    for(const[k,v]of Object.entries(p.buffer||{}))if(BYID[k]&&!DB.buffer[k])DB.buffer[k]={s:v.s||0,f:v.f||1};
    DB.sessions=DB.sessions.concat(p.sessions||[]);DB.fossils+=p.fossils||0;
    const bs=p.best||{};DB.best.score=Math.max(DB.best.score,bs.score||0);DB.best.combo=Math.max(DB.best.combo,bs.combo||0);
    for(const[k,v]of Object.entries(p.bestMode||{}))DB.bestMode[k]=Math.max(DB.bestMode[k]||0,+v||0);
    return{};
  }
  return{};
}
const evCmp=(a,b)=>a.t-b.t||(a.i<b.i?-1:a.i>b.i?1:0);
function rebuild(){derivedReset(DB);DB.ev.sort(evCmp);for(const e of DB.ev)applyEvent(e);DB.sessions.sort((a,b)=>(a.ts||0)-(b.ts||0))}
function addLocal(e){e.i=DB.dev.id+"-"+e.t.toString(36)+"-"+rid().slice(0,4);e.d=DB.dev.id;DB.ev.push(e);DB.outbox.push(e.i);return applyEvent(e)}
// Formato anterior (sin eventos) → un único snapshot 'b'
function legacySnap(o){
  let best=o.best||{},bestMode=o.bestMode||{};
  if(typeof best.score!=="number"){bestMode=best;best={score:Math.max(0,...Object.values(best).map(Number).filter(n=>!isNaN(n))),combo:0}}
  return {cats:o.cats,items:o.items,buffer:o.buffer,sessions:o.sessions,fossils:o.fossils,best,bestMode};
}
function load(){
  let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  const f=fresh();
  if(o&&o.v===2){o.settings=Object.assign(f.settings,o.settings);DB=Object.assign(f,o)}
  else{DB=f;if(o&&o.cats){Object.assign(DB.settings,o.settings||{});
    if(Object.keys(o.cats||{}).length||(o.sessions||[]).length){const e={t:1,k:"b",snap:legacySnap(o)};e.i=DB.dev.id+"-legacy";e.d=DB.dev.id;DB.ev.push(e);DB.outbox.push(e.i)}}}
  rebuild();save();
}
function persisted(){const{cats,items,buffer,sessions,fossils,best,bestMode,...p}=DB;return p}

const catAcc=c=>{const s=cs(c);if(s.r.length)return s.r.reduce((a,b)=>a+b,0)/s.r.length;return s.n?1-s.w/s.n:null};
const meterCls=p=>p==null?"none":p<.6?"bad":p<.8?"warn":"";
const todayStats=()=>{const t=DB.sessions.filter(x=>x.d===today());const n=t.reduce((a,x)=>a+x.n,0),ok=t.reduce((a,x)=>a+(x.ok!=null?x.ok:Math.round(x.acc*x.n/100)),0);return {n,ok}};
function streakNow(){const days=new Set(DB.sessions.map(x=>x.d));let n=0;const d=new Date();if(!days.has(today(d)))d.setDate(d.getDate()-1);while(days.has(today(d))){n++;d.setDate(d.getDate()-1)}return n}

/* ================= SYNC (Worker → D1 → Notion) =================
   Sin conexión todo funciona: los eventos esperan en DB.outbox. Nunca se sincroniza durante una ronda. */
let syncState="off",syncBusy=false;
function syncConfigured(){return !!(DB.settings.syncUrl&&DB.settings.syncKey)}
async function syncNow(manual){
  if(!syncConfigured()){syncState="off";return}
  if(syncBusy||view==="drill")return;
  if(typeof navigator!=="undefined"&&navigator.onLine===false){syncState="offline";refreshSync();return}
  syncBusy=true;syncState="busy";refreshSync();
  try{
    let more=true,changed=false,guard=0;
    while(more&&guard++<20){
      const ids=new Set(DB.outbox),out=DB.ev.filter(e=>ids.has(e.i)).slice(0,1000);
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);
      const r=await fetch(DB.settings.syncUrl.replace(/\/+$/,"")+"/sync",{method:"POST",signal:ctl.signal,
        headers:{"Authorization":"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"},
        body:JSON.stringify({dev:DB.dev.id,since:DB.cursor,events:out})});
      clearTimeout(to);
      if(r.status===401){syncState="badkey";break}
      if(!r.ok)throw new Error("HTTP "+r.status);
      const res=await r.json(),sent=new Set(out.map(e=>e.i));
      DB.outbox=DB.outbox.filter(i=>!sent.has(i));
      const have=new Set(DB.ev.map(e=>e.i));
      for(const e of res.events||[])if(!have.has(e.i)){DB.ev.push(e);have.add(e.i);changed=true}
      DB.cursor=res.cursor||DB.cursor;more=!!res.more||DB.outbox.length>0;
      syncState="ok";DB.lastSync=Date.now();
    }
    if(changed&&view!=="drill")rebuild();
    save();if(manual)toast(syncState==="ok"?"☁ Sincronizado":"⚠ Clave inválida");
  }catch(err){syncState=navigator.onLine===false?"offline":"error";if(manual)toast("No se pudo sincronizar: "+(err.name==="AbortError"?"sin respuesta":err.message))}
  finally{syncBusy=false;if(view==="home"||view==="stats"||view==="end")render();else{refreshSync();if(view==="tarea"&&typeof renderTarea==="function"&&!document.activeElement.closest(".tk-item"))renderTarea(true)}}
}
function syncLabel(){
  if(!syncConfigured())return["☁︎ Sin nube","muted"];
  const p=DB.outbox.length;
  if(syncState==="busy")return["☁ Sincronizando…",""];
  if(syncState==="offline")return[`○ Sin conexión${p?" · "+p+" pend.":""}`,"warn"];
  if(syncState==="badkey")return["⚠ Clave inválida","bad"];
  if(syncState==="error")return[`⚠ Error de sync${p?" · "+p+" pend.":""}`,"bad"];
  if(p)return[`☁ ${p} pendientes`,"warn"];
  return["☁ Sincronizado","ok"];
}
function refreshSync(){const el=document.getElementById("syncPill");if(el){const[t,c]=syncLabel();el.textContent=t;el.dataset.s=c}}

/* ---------- Fondo propio: imágenes elegidas en este dispositivo (IndexedDB; no se sincronizan) ----------
   De cada imagen se saca el color medio (decide claro/oscuro y el tinte de las tarjetas) y los dos
   tonos más vivos (acento y acento 2). Las tarjetas quedan translúcidas para que se vea la imagen. */
const FONDO={lista:[],cargado:false,act:null,pal0:null,url:'',urlId:'',vel:35};
try{const a=JSON.parse(localStorage.getItem('forge-fondo-act')||'null');if(a){FONDO.act=a.id;FONDO.pal0=a.pal}FONDO.vel=+(localStorage.getItem('forge-fondo-vel')||35)}catch(e){}
function fondoIdb(){return new Promise((ok,no)=>{const r=indexedDB.open('mextforge-fondo',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function fondoTx(modo,fn){const db=await fondoIdb();return await new Promise((ok,no)=>{const t=db.transaction('f',modo),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})}
async function fondoInit(){try{FONDO.lista=(await fondoTx('readonly',st=>st.getAll()))||[];FONDO.lista.sort((a,b)=>a.t-b.t)}catch(e){FONDO.lista=[]}
  FONDO.cargado=true;if(FONDO.act&&!FONDO.lista.some(x=>x.id===FONDO.act))fondoUsar(null);applyTheme();if(view==='home')render()}
function fondoActual(){if(!FONDO.act)return null;return FONDO.lista.find(x=>x.id===FONDO.act)||(!FONDO.cargado&&FONDO.pal0?{id:FONDO.act,pal:FONDO.pal0}:null)}
function fondoUsar(id){FONDO.act=id;const f=id&&FONDO.lista.find(x=>x.id===id);

let G=null;
function weightOf(it,blind){
  const s=DB.items[it.id]||{w:0,c:0};
  let w=1+s.w*2-Math.min(s.c,4)*.2;
  if(blind)w*=1+errRate(it.c)*8;
  return Math.max(.15,w);
}
function pick(pool,n,blind,exclude){
  const out=[],cand=pool.filter(x=>!(exclude&&exclude.has(x.id)));
  while(out.length<n&&cand.length){
    const ws=cand.map(x=>weightOf(x,blind));let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    while(i<ws.length-1&&r>ws[i]){r-=ws[i];i++}
    out.push(cand.splice(i,1)[0]);
  }
  return out;
}
function bufItems(filter){return Object.keys(DB.buffer).map(id=>BYID[id]).filter(x=>x&&(!filter||filter(x)))}
function buildQueue(key){
  let pool,blind=false,lead=[];
  if(key==="buf"){const b=shuffle(bufItems());return b.slice(0,ROUND)}
  if(key==="days"){const L=shuffle(LESSONS.slice());return L.slice(0,20)}
  if(String(key).startsWith("day:")){const d=key.slice(4);return shuffle(LESSONS.filter(x=>x.L===d)).slice(0,20)}
  // Producción: 8 tarjetas (mín. 3; si hay pocas, se repiten), primero las del buffer; sin tiempo por pregunta
  if(key==="prod"||String(key).startsWith("prod:")){const kk=key.slice(5),pool2=PROD.filter(x=>!kk||x.L===kk);if(!pool2.length)return[];
    const n=Math.min(8,Math.max(3,2*pool2.length)),q=shuffle(bufItems(x=>x.k==="W"&&(!kk||x.L===kk))).slice(0,3);
    while(q.length<n){const add=pick(pool2,Math.min(n-q.length,pool2.length),false,new Set(q.slice(-1).map(x=>x.id)));if(!add.length)break;q.push(...add)}
    return q.slice(0,n)}
  if(key==="top")return topErrores().map(x=>BYID[x.k]).filter(Boolean);
  if(key==="mix"){pool=allItems();blind=true;lead=shuffle(bufItems(x=>x.k!=="W")).slice(0,3)}
  else if(CATS[key]){pool=ITEMS.filter(x=>x.c===key);lead=shuffle(bufItems(x=>x.c===key)).slice(0,3)}
  else if(key==="hunter")pool=ITEMS.filter(x=>x.k==="E");
  else if(key==="rebuild")pool=ITEMS.filter(x=>x.k==="R");
  else if(key==="fossil")pool=ITEMS.filter(x=>x.fos);
  else if(key==="death")pool=allItems();
  const ex=new Set(lead.map(x=>x.id));
  return shuffle(lead).concat(pick(pool,(key==="death"?20:ROUND)-lead.length,blind,ex));
}
function start(key,custom){
  ac();
  const queue=custom||buildQueue(key);
  if(!queue.length){toast(key==="buf"?"Buffer vacío. Nada pendiente ✨":"No hay ejercicios aquí");return}
  G={key,sid:DB.dev.id+"-"+Date.now().toString(36),queue,pool:key==="death"?ITEMS:null,death:key==="death",idx:0,score:0,combo:0,maxCombo:0,lives:3,res:[],speedMul:1,freed:0,state:"q",raf:0,timer:0,byCat:{}};

}
function limitFor(it){const sp=SPEEDS[DB.settings.speed];return (it.k==="E"?sp.eh:sp.rb)*G.speedMul}
function nextQ(){
  clearTimeout(G.timer);
  if(G.death){
    if(G.lives<=0)return finish();
    if(G.idx>=G.queue.length)G.queue.push(...pick(allItems(),15,false,new Set(G.queue.slice(-10).map(x=>x.id))));
  }
  while(G.idx<G.queue.length&&!BYID[G.queue[G.idx].id])G.idx++; // lecciones que el instructor borró
  if(G.idx>=G.queue.length)return finish();
  const it=G.it=G.queue[G.idx];
  if(it.L&&it.all&&it.all.length>4){const c=it.all.find(o=>o.ok);it.o=[c.t].concat(shuffle(it.all.filter(o=>!o.ok)).slice(0,3).map(o=>o.t))}
  G.state="q";G.chosen=null;G.gain=0;G.fos=null;G.limit=limitFor(it);G.qEl=0;G.last=performance.now();
  if(it.k==="R")G.order=shuffle(it.o.map((_,i)=>i));
  if(it.k==="W"){G.limit=Infinity;G.typed="";G.pr=null}
  renderDrill();

const RC=2*Math.PI*20;
function tick(t){
  if(view!=="drill"||!G||G.state!=="q")return;
  const dt=t-G.last;G.last=t;
  if(!document.hidden)G.qEl+=dt;
  if(G.qEl>=G.limit)return answer(-1);

  G.raf=requestAnimationFrame(tick);

function updateClock(){
  const fg=$("#tfg"),tx=$("#ttx"),tr=$("#tring"),qt=$("#qt");
  const p=G.state==="q"?Math.max(0,1-G.qEl/G.limit):0;
  if(fg)fg.style.strokeDashoffset=RC*(1-p);
  if(tx)tx.textContent=G.state==="q"?Math.ceil((G.limit-G.qEl)/1000):"";
  if(tr)tr.classList.toggle("low",p<.3);
  if(qt){qt.style.width=(100*p)+"%";qt.className=p<.25?"low":p<.5?"mid":""}
}
// pr = respuesta escrita (producción): {ok, exact, typed}
function answer(choice,pr){
  if(!G||!(G.state==="q"||pr&&G.state==="judge"))return;
  cancelAnimationFrame(G.raf);
  const it=G.it,ms=Math.min(G.qEl,G.limit),timeout=!pr&&choice<0;
  const orig=it.k==="R"&&!timeout?G.order[choice]:choice;
  const ok=pr?!!pr.ok:!timeout&&(it.k==="E"?choice===it.e:orig===0);
  let fos=null;G.pr=pr||null;
  if(!ok&&!pr){if(it.k==="E")fos=fossilOf(clean(it.t));else if(!timeout)fos=fossilOf(fill(it.q,it.o[orig]))}
  // evento de respuesta (fuente de verdad); el estado derivado se actualiza al aplicarlo
  const bc=G.byCat[it.c]||(G.byCat[it.c]={n:0,ok:0});bc.n++;if(ok)bc.ok++;
  // detalle para el instructor: pregunta, lo que respondió y lo correcto (unido a la ronda por sid)
  const segs=it.k==="E"?it.t.match(/\[([^\]]+)\]/g).map(x=>x.slice(1,-1)):null;
  const det=pr?{c:it.c,sid:G.sid,pr:it.q,ch:pr.typed+(pr.ok&&!pr.exact?" (válida según yo)":""),cr:it.ans}
    :{c:it.c,sid:G.sid,pr:it.k==="E"?clean(it.t):it.q,ch:timeout?"":it.k==="E"?segs[choice]:it.o[orig],cr:it.k==="E"?segs[it.e]+" → "+it.fx:it.o[0]};
  if(addLocal(Object.assign({t:Date.now(),k:"a",q:it.id,o:ok?1:0,ms:Math.round(ms),to:timeout?1:0,f:fos?1:0},det)).freed)G.freed++;
  save();
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=1+Math.min(4,Math.floor(G.combo/3))*.5;
    G.gain=Math.round((100+100*(1-ms/G.limit))*mult);G.score+=G.gain;
    if(G.death)G.speedMul=Math.max(.55,G.speedMul*.95);

function cont(){if(!G||G.state!=="fb")return;if(!G.ok&&performance.now()-G.fbAt<350)return;clearTimeout(G.timer);G.idx++;nextQ()}
function quit(){if(G){clearTimeout(G.timer);cancelAnimationFrame(G.raf)}G=null;view="home";render()}
function finish(){
  const r=G.res,n=r.length,good=r.filter(x=>x.ok).length,acc=n?good/n:0;

function instructorStats(){

  for(const d of dias){
    const p=sesProps(d);
    if(!dom&&p&&p.dom!=null)dom={fase:p.fase||"1",pct:Math.round(p.dom),d};
    if(!tem&&p&&p.domTema!=null){let v=p.domTema;if(v>0&&v<1)v*=100;tem={tema:p.tema||"tema actual",pct:Math.max(0,Math.min(100,Math.round(v))),d}}
    if(!hrs&&p&&p.horas!=null)hrs={acc:p.horas,meta:p.meta!=null?p.meta:500,d};
    if(dom&&hrs&&tem)break;
    if(!T.ses[d])continue;
    const txt=blocksText(T.ses[d].blocks);
    if(!dom){const m=txt.match(/📊\s*Fase\s*(\d)\s*(?:[:·\-–—]\s*)?(?:dominio\s*)?(\d{1,3}(?:[.,]\d+)?)\s*%/i);if(m)dom={fase:+m[1],pct:Math.round(numOf(m[2])),d}}

      if(m){const mm=txt.match(/meta(?:\s+(?:de\s+)?horas)?\s*:?\s*(\d+(?:[.,]\d+)?)/i);hrs={acc:numOf(m[1]),meta:mm?numOf(mm[1]):500,d}}}

function nivelBadge(){

  for(const d of ks){const p=sesProps(d);if(p&&p.nivel)return `<span class="nivel" title="Nivel según el instructor · ${fechaCorta(sDate(d))}">${esc(p.nivel)}</span>`}
  return "";
}
/* Dato viejo: si el instructor no lo actualiza hace 7 días o más, la pastilla se atenúa y dice «hace N días».
   Solo informa: no cambia el valor ni presiona. */
const hace=d=>{if(!d)return null;const n=Math.floor((Date.now()-new Date(String(d).slice(0,10)+"T12:00:00"))/864e5);return n>=7?n:null};
const viejoCls=n=>n?" viejo":"",viejoTxt=(n,pre="")=>n?` <span class="hace">· ${pre}hace ${n} días</span>`:"";
/* Dominio de la fase = temas en 100% ÷ temas de la fase en «🗺️ Temas» (la misma cuenta del instructor).
   El criterio sigue siendo suyo: él decide cuándo un tema llega a 100; la app solo suma.
   Sin lista de temas para esa fase, se usa el «Dominio %» de la sesión (como antes). */
function faseActual(){
  for(const d of porFecha([...new Set([...Object.keys(T.ses),...T.list.map(x=>x.k)])])){const p=sesProps(d);if(p&&p.fase)return "Fase "+p.fase}
  const ts=T.temas||[];return [...new Set(ts.map(t=>t.fase))].find(f=>ts.some(t=>t.fase===f&&temaPct(t)!==100))||null;
}
function dominioFase(){
  const fase=faseActual(),ts=(T.temas||[]).filter(t=>t.fase===fase);
  if(!fase||!ts.length)return null;
  const dom=ts.filter(t=>temaPct(t)===100).length;let fecha="";
  for(const t of ts){const x=temaDeSesion(t),f=(x&&x.edited)||t.edited||"";if(f>fecha)fecha=f}
  return{fase,pct:Math.round(1000*dom/ts.length)/10,dom,n:ts.length,fecha:fecha.slice(0,10)};
}
function instructorPills(){
  const{dom,hrs,tem}=instructorStats(),df=dominioFase();let h="";
  if(df){const n=hace(df.fecha);h+=`<span class="pill${viejoCls(n)}" style="color:var(--accent)" title="Temas en 100% ÷ temas de la fase (🗺️ Temas). Los % de cada tema los pone el instructor · actualizado ${fechaCorta(df.fecha)}">📈 ${esc(df.fase)}: ${String(df.pct).replace(".",",")}% · ${df.dom}/${df.n} temas${viejoTxt(n)}</span>`}
  else if(dom){const n=hace(sDate(dom.d));h+=`<span class="pill${viejoCls(n)}" style="color:var(--accent)" title="Lo estima el instructor; no lo calcula la app">📈 Dominio Fase ${dom.fase}: ${dom.pct}% · instructor, ${fechaCorta(sDate(dom.d))}${viejoTxt(n)}</span>`}
  // Dominio del tema actual: en 100 queda superado; el instructor decide cuándo pasar al siguiente
  if(tem){const n=hace(sDate(tem.d));h+=tem.pct>=100?`<span class="pill${viejoCls(n)}" style="color:var(--inf)" title="El instructor lo dio por superado">✅ ${esc(tem.tema)}: superado · instructor, ${fechaCorta(sDate(tem.d))}${viejoTxt(n)}</span>`
    :`<span class="pill${viejoCls(n)}" style="color:var(--inf)" title="Lo estima el instructor; no lo calcula la app">🎯 ${esc(tem.tema)}: ${tem.pct}% · instructor, ${fechaCorta(sDate(tem.d))}${viejoTxt(n)}</span>`}
  if(hrs){const dias=Math.max(1,daysTo(EXAM)),min=Math.max(0,Math.round((hrs.meta-hrs.acc)*60/dias)),n=hace(sDate(hrs.d));
    h+=`<span class="pill${viejoCls(n)}" title="(meta ${hrs.meta} h − ${hrs.acc} h acumuladas) ÷ ${dias} días hasta el 15 jul 2027 · datos del instructor, ${fechaCorta(sDate(hrs.d))}">⏱ Debes estudiar ${Math.floor(min/60)} h ${min%60} min/día${viejoTxt(n,"horas de ")}</span>`}
  return h;
}

// Título de tarea normalizado: sin emoji, sin «Escritura:», sin «· N min» ni «: 2/4».
// Título normalizado para emparejar cada actividad con su «### …» de la corrección: sin emoji, sin «Tipo:», sin «: 6/6»,
// sin «(6)» ni lo que va después de « · » (tiempo, «10 ítems», ⏱…)
const cNorm=t=>{let x=nfe(t).replace(/^[^\p{L}\p{N}]+/u,"").replace(/\s*:\s*\d+(?:[.,]\d+)?\s*\/\s*\d+\s*$/,"");

// Comparación por palabras (LCS): en la respuesta se subraya lo que sobra o está mal, ‸ marca lo que falta;

const cTok=s=>String(s||"").replace(/[’‘]/g,"'").match(/\n|[A-Za-z0-9'-]+|[^\s]/g)||[];

let tBusy=false;
async function fetchTareas(extra,force){
  if(!syncConfigured()){tState="nocloud";return}

    if(T.list[0])want.add(T.list[0].k);
    for(const x of T.list){if(want.size>=4)break;const s=T.ses[x.k];if(s&&!parseSession(s.blocks).retro.length)want.add(x.k)}
    for(const x of T.list){if(want.size>=6)break;if(!T.ses[x.k])want.add(x.k)}
    // El servidor tiene un presupuesto de llamadas a Notion por pedido: lo que no alcanza vuelve en «pending»
    // y se pide en otra vuelta (las sesiones pendientes conservan lo ya guardado mientras tanto).
    // Notion guarda «última edición» al minuto: si la última descarga fue a menos de 3 min de una edición, pudo
    // quedar a medias, así que se vuelven a pedir todas. «ronda» es una por actualización (el servidor relee lo
    // editado hace poco con esa clave); «fresh» (al tocar «Actualizar») le pide releer lo de las últimas 24 h.
    const dudoso=(at,ed)=>{const t=Date.parse(ed);return !at||isNaN(t)||at-t<180000};
    const ronda=Date.now(),fresh=!!force||!T.verOk||T.list.some(x=>x.src==="db"&&T.ses[x.k]&&dudoso(T.ses[x.k].at,x.edited));
    if(fresh)for(const x of T.list)want.add(x.k);

    // Temas por fase (base del instructor); si la base no existe, se ignora
    try{const r=await fetch(DB.settings.syncUrl.replace(/\/+$/,"")+"/temas/lista",{method:"POST",headers:{"Authorization":"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"},body:"{}"});const j=await r.json();if(j.ok){T.temas=j.temas||[];tSave(true)}}catch(e){}

      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
      const r=await fetch(DB.settings.syncUrl.replace(/\/+$/,"")+"/tareas/lista",{method:"POST",signal:ctl.signal,
        headers:{"Authorization":"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"},body:JSON.stringify(force?{dates,ronda,fresh:true}:{dates,ronda})});

      for(const[d,blocks]of Object.entries(j.sessions||{})){const it=T.list.find(x=>x.k===d);T.ses[d]={tid:it&&it.tid,date:it?it.date:d,title:it?it.title:d,blocks,at:Date.now(),src:it&&it.src,edited:it&&it.edited,props:it&&it.props}}

      {const vivas=new Map(T.list.map(x=>[x.k,x.tid]));for(const d of Object.keys(T.ses))if(!vivas.has(d)||(T.ses[d].tid&&vivas.get(d)!==T.ses[d].tid&&!recibidas.has(d)&&!(j.sessions||{})[d]))delete T.ses[d]}

      for(const x of T.list)if(x.src==="db"&&!recibidas.has(x.k)&&!dates.includes(x.k)&&(!T.ses[x.k]||T.ses[x.k].edited!==x.edited||T.ses[x.k].tid!==x.tid))dates.push(x.k);

/* 🎙️ Consignas orales: se graba con el micrófono o se elige un audio (mp3, m4a…). El audio sube al Worker,
   que lo transcribe (el instructor lee la página, no puede escuchar) y lo adjunta a Notion al entregar.
   La respuesta queda como «[audio:<id>|<s>s] transcripción» y viaja al otro dispositivo como cualquier borrador. */
const AU_MARCA=/^\[audio:([\w-]{6,64})\|(\d+)s\]\s*/,AU_MAX=5*1024*1024,AU_SEG=300;
let auRec=null;const auUrl={},auEst={};
function auIdb(){return new Promise((ok,no)=>{const r=indexedDB.open("mextforge-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function auGet(id){try{const db=await auIdb();return await new Promise(ok=>{const q=db.transaction("a").objectStore("a").get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function auPut(id,v){try{const db=await auIdb();await new Promise(ok=>{const t=db.transaction("a","readwrite");t.objectStore("a").put(v,id);t.oncomplete=ok;t.onerror=ok})}catch(e){}}
const auFmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
const auRepintar=()=>{if(view==="tarea")renderTarea(true)};
function auVista(am,r){const id=am[1],tx=r.slice(am[0].length).trim();
  return `${auUrl[id]?`<audio controls preload="none" src="${auUrl[id]}"></audio>`:`<button class="btn" data-tk="au-oir" data-v="${esc(id)}">▶ Escuchar (${am[2]} s)</button>`}
    <div class="muted small au-tx">Transcripción automática: <span lang="en">${tx?esc(tx):"(no entendió nada)"}</span></div>`}
function auHtml(id,A,locked){
  const st=auEst[id],am=String(A.v||"").match(AU_MARCA);
  if(auRec&&auRec.id===id)return `<div class="au au-on"><span class="au-dot"></span> Grabando <b id="auT">${auFmt(Math.round((Date.now()-auRec.t0)/1000))}</b><button class="btn" data-tk="au-stop">⏹ Detener</button></div>`;
  if(st==="sub")return `<div class="au muted small">Subiendo y transcribiendo…</div>`;
  if(am)return `<div class="au">${auVista(am,A.v)}${locked?"":`<button class="btn" data-tk="au-del" data-v="${id}">🗑 Borrar y grabar otra vez</button>`}</div>`;
  if(locked)return `<div class="au muted small">(sin audio)</div>`;
  const err=st&&st.err||(A.aup?"El audio quedó guardado aquí, pero falta subirlo.":"");
  return `<div class="au">${err?`<div class="small" style="color:var(--bad,#c33)">${esc(err)} <button class="btn" data-tk="au-retry" data-v="${id}">Reintentar</button></div>`:""}
    <button class="btn" data-tk="au-rec" data-v="${id}" ${auRec?"disabled":""}>🎙️ Grabar</button>
    <label class="btn">📁 Subir audio<input type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" data-au-file="${id}" hidden></label>
    <div class="muted small">Máx. ${AU_SEG/60} min o 5 MB. El instructor recibe el audio y una transcripción automática.</div></div>`}
function auMime(){if(!window.MediaRecorder)return null;for(const m of["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"])if(MediaRecorder.isTypeSupported(m))return m;return ""}
function auTimer(el){const bx=el&&el.closest("[data-act-key]");if(bx){startTimer(tDate,bx.dataset.actKey);updTimers()}}
async function auGrabar(btn){const id=btn.dataset.v,mime=auMime();
  if(mime===null||!navigator.mediaDevices){toast("Este navegador no puede grabar: usa «Subir audio»");return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast("Sin permiso para el micrófono");return}
  auTimer(btn);
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000}),ch=[];
  auRec={id,d:tDate,mr,t0:Date.now()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onstop=()=>{const r=auRec;auRec=null;clearInterval(auGrabar.h);stream.getTracks().forEach(t=>t.stop());
    auListo(r.d,id,new Blob(ch,{type:(mr.mimeType||mime||"audio/webm")}),Math.max(1,Math.round((Date.now()-r.t0)/1000)))};
  mr.start(1000);auRepintar();
  auGrabar.h=setInterval(()=>{if(!auRec)return;const s=Math.round((Date.now()-auRec.t0)/1000),el=document.getElementById("auT");if(el)el.textContent=auFmt(s);if(s>=AU_SEG)auRec.mr.stop()},500)}
function auDur(blob){return new Promise(ok=>{const u=URL.createObjectURL(blob),x=new Audio();let hecho=false;const fin=v=>{if(hecho)return;hecho=true;URL.revokeObjectURL(u);ok(v)};
  x.preload="metadata";x.onloadedmetadata=()=>fin(isFinite(x.duration)?Math.round(x.duration):0);x.onerror=()=>fin(0);setTimeout(()=>fin(0),4000);x.src=u})}
async function auArchivo(id,f,el){
  if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name)){toast("Ese archivo no es un audio");return}
  if(f.size>AU_MAX){toast("El audio pasa de 5 MB: grábalo más corto");return}
  auTimer(el);auListo(tDate,id,f,Math.max(1,await auDur(f)))}
async function auListo(d,id,blob,dur){
  if(blob.size>AU_MAX){auEst[id]={err:"El audio pasa de 5 MB."};auRepintar();return}
  const aid="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  await auPut(aid,{blob,dur});auUrl[aid]=URL.createObjectURL(blob);
  tAns(d,id).aup=aid;tSave(true);auSubir(d,id)}
async function auSubir(d,id){const A=tAns(d,id),aid=A.aup;if(!aid)return;
  const x=await auGet(aid);if(!x){delete A.aup;auEst[id]={err:"Se perdió la grabación: vuelve a grabar."};tSave(true);auRepintar();return}
  if(!syncConfigured()){auEst[id]={err:"Falta configurar la sincronización (Ajustes) para enviar audios."};auRepintar();return}
  auEst[id]="sub";auRepintar();
  try{const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=()=>no(fr.error);fr.readAsDataURL(x.blob)});
    const r=await fetch(bBase()+"/audio/subir",{method:"POST",headers:bH(),body:JSON.stringify({id:aid,mime:x.blob.type||"audio/mpeg",dur:x.dur,b64})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
    if(!tLocked(d)){A.v=`[audio:${aid}|${x.dur}s] ${j.texto||""}`.trim();delete A.aup;delete auEst[id];tSave(true)}}
  catch(e){auEst[id]={err:navigator.onLine===false?"Sin conexión: el audio quedó guardado aquí.":"No se pudo subir ("+(e.message||e)+")."}}
  auRepintar()}
async function auOir(aid){const x=await auGet(aid);
  if(x){auUrl[aid]=URL.createObjectURL(x.blob);auRepintar();return}
  try{toast("Descargando audio…");const r=await fetch(bBase()+"/audio/bajar",{method:"POST",headers:bH(),body:JSON.stringify({id:aid})});const j=await r.json();if(!r.ok)throw 0;
    const blob=new Blob([Uint8Array.from(atob(j.b64),c=>c.charCodeAt(0))],{type:j.mime});await auPut(aid,{blob,dur:0});auUrl[aid]=URL.createObjectURL(blob);auRepintar()}
  catch(e){toast("No se pudo descargar el audio")}}
document.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.auFile,f=e.target.files&&e.target.files[0];if(id&&f&&view==="tarea"){e.target.value="";auArchivo(id,f,e.target)}});

/* ===== Después de pintar cualquier pantalla: tablas al lado, índice de la sesión y animación de entrada ===== */
/* 📌 Tablas al lado: el 📌 de cualquier tabla la deja fija a la izquierda de la pantalla mientras estudias
   (aparte de la 🔍 Consulta, que va a la derecha). Se quita con su ✕ o tocando otra vez el 📌. Solo en este dispositivo. */
const ladoOn=id=>(T.lado||[]).some(x=>x.id===id);
function ladoBuscar(id){for(const d of Object.keys(T.ses)){const p=parseSession(T.ses[d].blocks);
    for(const a of p.acts){const t=eTables(a.blocks,[]).find(x=>x.id===id);if(t)return{b:t,tit:a.title||tituloSes(d),f:sDate(d)}}
    const t=eTables(p.intro,[]).find(x=>x.id===id);if(t)return{b:t,tit:tituloSes(d),f:sDate(d)}}
  return null}
function ladoToggle(id){T.lado=T.lado||[];const i=T.lado.findIndex(x=>x.id===id);
  if(i>=0)T.lado.splice(i,1);else{const x=ladoBuscar(id);if(!x){toast("No encontré esa tabla");return}T.lado.push({id,...x})}
  tSave(true);document.querySelectorAll(".epin").forEach(b=>{const on=ladoOn(b.dataset.v);b.classList.toggle("on",on);b.title=on?"Quitar del lado izquierdo":"Fijar a la izquierda de la pantalla"});ladoPintar()}
function ladoPintar(){let el=document.getElementById("lado");const ver=(T.lado||[]).length&&["tarea","tareas","ref","mat","tem","sim","simu"].includes(view);
  document.body.classList.toggle("lado-on",!!ver);
  if(!ver){if(el)el.remove();return}
  if(!el){el=document.createElement("aside");el.id="lado";document.body.appendChild(el)}
  blockHtml.sinPin=true;
  try{el.innerHTML=T.lado.map(x=>`<div class="ld-it"><div class="ld-h"><span>📌 <b>${esc(x.tit)}</b> <span class="muted small">${esc(fechaCorta(x.f||""))}</span></span><button class="ld-x" data-tk="lado" data-v="${esc(x.id)}" aria-label="Quitar">✕</button></div>${blockHtml(x.b)}</div>`).join("")}
  finally{blockHtml.sinPin=false}}
/* Índice de la sesión: rayitas arriba a la derecha (junto a la barra de desplazamiento), una por actividad.
   Al pasar el mouse muestran el nombre; al tocar llevan a esa actividad. ⤒ sube al inicio. Con la 🔍 abierta se corren a su borde. */
function tocPintar(){let el=document.getElementById("etoc");
  const secs=view==="tarea"?[...document.querySelectorAll("#app .tk-act")]:[];
  if(!secs.length){if(el)el.remove();return}
  if(!el){el=document.createElement("nav");el.id="etoc";el.setAttribute("aria-label","Índice de la sesión");document.body.appendChild(el);
    el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.toc==="top")return window.scrollTo({top:0,behavior:"smooth"});
      const t=document.querySelectorAll("#app .tk-act")[+b.dataset.toc];if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-12,behavior:"smooth"})})}
  el.innerHTML=`<button data-toc="top" class="toc-top" title="Volver al inicio"><span class="toc-l">Volver al inicio</span>⤒</button>`+secs.map((x,i)=>{
    const k=x.querySelector(".tag"),b=x.querySelector(".tk-title"),kt=k?k.textContent.trim():"",bt=b?b.textContent.trim():"";
    const t=(kt&&bt?kt+" · "+bt:kt||bt).slice(0,70);
    return `<button data-toc="${i}" title="${esc(t)}"><span class="toc-l">${esc(t)}</span><i></i></button>`}).join("");
  tocActual()}
function tocActual(){const el=document.getElementById("etoc");if(!el)return;let cur=0;
  document.querySelectorAll("#app .tk-act").forEach((x,i)=>{if(x.getBoundingClientRect().top<160)cur=i});
  el.querySelectorAll("[data-toc]").forEach(b=>b.classList.toggle("on",b.dataset.toc===String(cur)))}
/* ↩ Volver a la tarea: se recuerda la sesión sin entregar y el punto donde ibas; en el inicio un botón te lleva de vuelta ahí */
function volverHtml(){const u=T.ultimo;if(!u||!T.ses[u.d]||tLocked(u.d)||entregasDe(u.d).length)return"";
  return `<button class="card evolver" data-tk="volver"><span class="muted small">↩ Volver a la tarea${u.sec?` · ${esc(u.sec)}`:""}</span><b>${esc(tituloSes(u.d))}</b></button>`}
let volverT=null;
window.addEventListener("scroll",()=>{if(view!=="tarea"||!tDate)return;tocActual();clearTimeout(volverT);volverT=setTimeout(()=>{
  let sec="";for(const el of document.querySelectorAll("#app .tk-act")){if(el.getBoundingClientRect().top>140)break;const b=el.querySelector(".tk-title");if(b)sec=b.textContent.trim()}
  T.ultimo={d:tDate,y:Math.round(window.scrollY),sec:sec.slice(0,60),t:Date.now()};tSave()},400)},{passive:true});
/* Sin parpadeos: la sincronización de fondo vuelve a pintar la pantalla cada poco. Si el resultado es idéntico
   y no acabas de tocar nada, no se toca el DOM; y el rebote de selección va solo en el botón que tocaste. */
let ultToque=0,popSel='';
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,()=>{ultToque=Date.now()},true));
document.addEventListener('click',e=>{ultToque=Date.now();popSel='';const b=e.target.closest&&e.target.closest('button');if(!b)return;
  const at=[...b.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join('');if(at){popSel='button'+at;setTimeout(popAplicar,0)}},true);
function popAplicar(){const b=popSel&&document.querySelector(popSel);popSel='';if(!b||!b.classList.contains('on'))return;
  b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');b.addEventListener('animationend',()=>b.classList.remove('pop'),{once:true})}
(function(){const app=document.getElementById('app'),d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');let ult=null;
  Object.defineProperty(app,'innerHTML',{configurable:true,get(){return d.get.call(this)},set(v){if(v===ult&&Date.now()-ultToque>1500)return;ult=v;d.set.call(this,v)}})})();
// La entrada se anima solo al cambiar de pantalla (no al repintar por un toque)
let postVista="";
function trasPintar(){ladoPintar();tocPintar();
  const v=view+"|"+(view==="tarea"?tDate:""),a=document.getElementById("app");
  if(v!==postVista&&view!=="drill"&&a){a.classList.remove("enter");void a.offsetWidth;a.classList.add("enter");clearTimeout(trasPintar.t);trasPintar.t=setTimeout(()=>a.classList.remove("enter"),1400)}
  postVista=v}
new MutationObserver(()=>{cancelAnimationFrame(trasPintar.r);trasPintar.r=requestAnimationFrame(trasPintar)}).observe(document.getElementById("app"),{childList:true});
/* Plegable: una sola fila; al tocarla se despliega deslizando (sin volver a pintar la pantalla) */
var PLEG={};
function plegHtml(k,head,body){return `<div class="pleg${PLEG[k]?" on":""}"><button class="lesson pleg-h" data-tk="pleg" data-v="${k}" aria-expanded="${!!PLEG[k]}">${head}<span class="pct lchev">▾</span></button><div class="pleg-b"><div class="pleg-in">${body}</div></div></div>`}
function catResumen(){const ps=Object.keys(CATS).filter(k=>k!=="DIA"&&k!=="ESC").map(c=>[c,catAcc(c)]).filter(x=>x[1]!=null);if(!ps.length)return "Aún sin datos";
  const prom=ps.reduce((a,x)=>a+x[1],0)/ps.length,peor=ps.slice().sort((a,b)=>a[1]-b[1])[0];
  return `Promedio ${Math.round(prom*100)}% · más débil: ${CATS[peor[0]].n} ${Math.round(peor[1]*100)}%`}
/* Buscar por día: «día 34», «dia34», «34», «29 oct», «29/10» o «2026-10-29» → función que dice si una sesión (clave) es de ese día */
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
function diaDe(q){q=String(q||"").trim().toLowerCase();if(!q)return null;let m;
  if(m=q.match(/^(?:d[ií]a|d)\s*(\d{1,3})$/)||q.match(/^(\d{1,3})$/)){const re=new RegExp("^d[ií]a\\s*"+m[1]+"(?!\\d)","i");return d=>re.test(tituloSes(d)||"")}
  if(/^\d{4}-\d\d-\d\d$/.test(q))return d=>sDate(d)===q;
  if(m=q.match(/^(\d{1,2})\s*(?:\/|-|\s|\s+de\s+)\s*(\d{1,2}|[a-z]{3})[a-z]*$/)){const mes=/^\d/.test(m[2])?+m[2]:MESES[m[2]];if(!mes)return null;
    const fin="-"+String(mes).padStart(2,"0")+"-"+m[1].padStart(2,"0");return d=>(sDate(d)||"").endsWith(fin)}
  return null}
const diaCorto=d=>{const m=(tituloSes(d)||"").match(/^d[ií]a\s*\d+/i);return m?m[0].replace(/^d[ií]a\s*/i,"Día "):fechaCorta(sDate(d))};
function matDias(){const dias=[];
  for(const d of porFecha(Object.keys(T.ses))){const p=parseSession(T.ses[d].blocks),tablas=[];
    eTables(p.intro,[]).forEach(t=>tablas.push({tema:"",t}));
    for(const a of p.acts)if(a.ty==="ref")eTables(a.blocks,[]).forEach(t=>tablas.push({tema:a.title,t}));
    if(tablas.length)dias.push({d,tablas})}
  return dias}
function diasChips(attr,activo){const ds=matDias();if(!ds.length)return"";
  const vistos=new Set();return `<div class="dchips"><span class="muted small">Por día:</span>${ds.map(x=>{const l=diaCorto(x.d);if(vistos.has(l))return"";vistos.add(l);return `<button class="lp-chip${activo&&activo.toLowerCase()===l.toLowerCase()?" on":""}" ${attr}="${esc(l)}">${esc(l)}</button>`}).join("")}</div>`}

/* ---------- sesión de un día ---------- */
function itemHtml(d,a,b,locked,V){
  const id=b.id,A=tAns(d,id);
  if(a.ty==="out"){const o=tOut(d,id);
    return `<div class="tk-item ${A.d?"doubt":""}" data-item="${id}" data-act-key="${a.key}"><label class="tk-check"><input type="checkbox" data-tk="outdone" data-v="${id}" ${o.done?"checked":""} ${locked?"disabled":""}> <span>${rtHtml(b.r)}</span></label>

  pauseAll(d);
  const e=buildEntrega(d),n=e.acts.reduce((x,a)=>x+(a.out?0:a.items.length),0),empty=e.acts.reduce((x,a)=>x+(a.out?0:a.items.filter(i=>!i.v&&!i.ch).length),0);
  if(!confirm(`¿Entregar la sesión del ${d}?\n\n${n} respuestas${empty?` (${empty} vacías)`:""} · ${e.dudas} ${e.dudas===1?"duda":"dudas"} · ${e.min} min${e.n>1?`\n\nSerá la entrega ${e.n}; las anteriores no se borran.`:""}`)){tSave();return renderTarea(true)}
  addLocal(e);save();T.edit[d]=false;tSave(true);
  if(syncConfigured()){const ev=DB.ev[DB.ev.length-1];bgCola("ent:"+ev.i,bBase()+"/sync",bH(),{events:[ev],since:Number.MAX_SAFE_INTEGER})}
  toast(syncConfigured()?(navigator.onLine===false?"Entrega guardada: se enviará al volver la conexión":"📤 Entregada"):"Entrega guardada. Configura la nube para que llegue a Notion; mientras, usa «Copiar respuestas».");
  renderTarea();syncNow();
}

function updTimers(){

  document.querySelectorAll("[data-tk=timer]").forEach(b=>{const t=tTm(tDate,b.dataset.v),lim=+b.dataset.lim,el=b.querySelector("[data-clock]");

    if(lim){const left=lim-tEl(t);el.textContent=(left>=0?"⏳ ":"⌛ +")+fmtMS(Math.abs(left));b.classList.toggle("over",left<0)}

}

/* ================= PANEL DE PROGRESO =================
   Un gráfico por pregunta, una sola serie cada uno (más su línea de referencia), marcas finas, etiqueta solo en
   el último valor, valor al tocar/pasar y tabla «Ver datos». SVG en línea: funciona sin conexión. */
const P_EXAMEN="2027-07-15",dms=f=>new Date(f+"T12:00:00").getTime();
const fcT=t=>fechaCorta(today(new Date(t)));
function verTip(el){const c=el.closest(".chart");if(!c)return;c.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");const cap=c.querySelector(".ccap");if(cap)cap.textContent=el.dataset.tip}
function tabla(cols,rows){return `<details class="cdatos"><summary>Ver datos</summary><div class="tk-table"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div></details>`}
const CW=340,CH=170,ML=30,MR=12,MT=14,MB=24;
function ejeY(max,paso,fmt){let s="";for(let v=0;v<=max+1e-9;v+=paso){const y=MT+(CH-MT-MB)*(1-v/max);s+=`<line x1="${ML}" x2="${CW-MR}" y1="${y}" y2="${y}" class="cgrid"/><text x="${ML-6}" y="${y+3.5}" class="cax" text-anchor="end">${fmt(v)}</text>`}return s}
function barras(datos,{max,paso,fmt,refV,refTxt,color,refColor}){
  const n=datos.length,bw=Math.min(26,(CW-ML-MR)/n-4),y0=CH-MB;
  let s=ejeY(max,paso,fmt);
  datos.forEach((d,i)=>{const cx=ML+(CW-ML-MR)*(i+.5)/n,hgt=Math.max(1,(CH-MT-MB)*Math.min(d.v,max)/max),y=y0-hgt;
    s+=`<g data-tip="${esc(d.tip)}" class="cmk"><rect x="${cx-bw/2-4}" y="${MT}" width="${bw+8}" height="${CH-MT-MB}" fill="transparent"/><path d="M${cx-bw/2},${y0}V${y+Math.min(4,hgt)}q0,-${Math.min(4,hgt)} 4,-${Math.min(4,hgt)}h${Math.max(0,bw-8)}q4,0 4,${Math.min(4,hgt)}V${y0}Z" fill="${d.color||color}"/></g>`;
    if(i===n-1||i===0)s+=`<text x="${cx}" y="${CH-8}" class="cax" text-anchor="middle">${esc(d.label)}</text>`;
    if(i===n-1)s+=`<text x="${cx}" y="${y-5}" class="clbl" text-anchor="middle">${esc(fmt(d.v))}</text>`;
  });
  if(refV!=null){const y=MT+(CH-MT-MB)*(1-refV/max),rc=refColor?` style="stroke:${refColor};stroke-width:2"`:"",tc=refColor?` style="fill:${refColor};font-weight:800"`:"";
    s+=`<line x1="${ML}" x2="${CW-MR}" y1="${y}" y2="${y}" class="cref"${rc}/><text x="${ML+4}" y="${y-4}" class="cax clbg"${tc}>${esc(refTxt)}</text>`}
  return `<svg viewBox="0 0 ${CW} ${CH}" class="csvg" role="img">${s}</svg>`;
}
function lineas(serie,{max,paso,fmt,x0,x1,refV,refTxt,ref2,color,serie2,color2}){
  const X=t=>ML+(CW-ML-MR)*(t-x0)/Math.max(1,x1-x0),Y=v=>MT+(CH-MT-MB)*(1-Math.min(v,max)/max);
  let s=ejeY(max,paso,fmt);
  if(refV!=null){const y=Y(refV);s+=`<line x1="${ML}" x2="${CW-MR}" y1="${y}" y2="${y}" class="cref"/><text x="${ML+4}" y="${y-4}" class="cax">${esc(refTxt)}</text>`}
  if(serie2&&serie2.length){const u=serie.length?serie[serie.length-1].v:null;
    if(serie2.length>1)s+=`<polyline points="${serie2.map(p=>X(p.t)+","+Y(p.v)).join(" ")}" fill="none" stroke="${color2}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    serie2.forEach((p,i)=>{s+=`<g data-tip="${esc(p.tip)}" class="cmk"><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="12" fill="transparent"/><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${color2}" stroke="var(--surface)" stroke-width="2"/></g>`;
      if(i===serie2.length-1)s+=`<text x="${Math.min(X(p.t),CW-MR-8)}" y="${Y(p.v)+(u!=null&&p.v>u?-9:18)}" class="clbl" text-anchor="middle">${esc(fmt(p.v))}</text>`})}
  if(ref2)s+=`<line x1="${X(ref2.t0)}" y1="${Y(ref2.v0)}" x2="${X(ref2.t1)}" y2="${Y(ref2.v1)}" class="cref"/>`;
  if(serie.length>1)s+=`<polyline points="${serie.map(p=>X(p.t)+","+Y(p.v)).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  serie.forEach((p,i)=>{s+=`<g data-tip="${esc(p.tip)}" class="cmk"><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="12" fill="transparent"/><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g>`;
    if(i===serie.length-1){const u=serie2&&serie2.length?serie2[serie2.length-1].v:null,abajo=u!=null&&p.v<u;s+=`<text x="${Math.min(X(p.t),CW-MR-8)}" y="${Y(p.v)+(abajo?18:-9)}" class="clbl" text-anchor="middle">${esc(fmt(p.v))}</text>`}});
  s+=`<text x="${ML}" y="${CH-8}" class="cax">${fcT(x0)}</text><text x="${CW-MR}" y="${CH-8}" class="cax" text-anchor="end">${fcT(x1)}</text>`;
  return `<svg viewBox="0 0 ${CW} ${CH}" class="csvg" role="img">${s}</svg>`;
}
function semana(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function topErrores(){
  const desde=Date.now()-7*864e5,m={};
  for(const e of DB.ev)if(e.k==="a"&&e.t>=desde&&!e.o&&BYID[e.q])m[e.q]=(m[e.q]||0)+1;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>({k,n}));
}
// Números del instructor por sesión: propiedades de la base y, en los días viejos, las líneas de texto
function sesNums(k){
  const p=sesProps(k)||{},s=T.ses[k],txt=s?blocksText(s.blocks):"",o={nota:notaDe(k),dom:p.dom,fase:p.fase,horas:p.horas,meta:p.meta};
  if(o.dom==null){const m=txt.match(/📊\s*Fase\s*(\d)\s*(?:[:·\-–—]\s*)?(?:dominio\s*)?(\d{1,3}(?:[.,]\d+)?)\s*%/i);if(m){o.fase=m[1];o.dom=numOf(m[2])}}
  if(o.horas==null){const m=txt.match(/horas\s+acumuladas\s*:?\s*(\d+(?:[.,]\d+)?)/i);if(m){o.horas=numOf(m[1]);const mm=txt.match(/meta(?:\s+(?:de\s+)?horas)?\s*:?\s*(\d+(?:[.,]\d+)?)/i);if(mm&&o.meta==null)o.meta=numOf(mm[1])}}
  return o;
}
function renderProg(){
  const ses=porFecha([...new Set([...Object.keys(T.ses),...T.list.map(x=>x.k)])]).reverse().map(k=>Object.assign({k,fecha:sDate(k),titulo:tituloSes(k)},sesNums(k))).filter(x=>x.fecha);
  const card=(t,sub,cuerpo)=>`<section class="card chart"><h3>${t}</h3>${sub?`<div class="muted small">${sub}</div>`:""}${cuerpo}<div class="ccap muted small" aria-live="polite">Toca un punto para ver su valor.</div></section>`;
  const vacio=t=>`<div class="muted small cvacio">${t}</div>`,coma=v=>String(Math.round(v*10)/10).replace(".",",");
  let html="";
  // 1) Calificación por sesión
  // Promedio de TODAS las notas (el gráfico muestra las últimas 14); color por nota: rojo < 7 · amarillo 7–7,9 · celeste 8–8,5 · verde > 8,5
  const todasN=ses.filter(s=>typeof s.nota==="number"),notas=todasN.slice(-14),prom=todasN.length?todasN.reduce((a,s)=>a+s.nota,0)/todasN.length:null;
  const cN=v=>({ok:"var(--ok)",cel:"var(--celn)",warn:"var(--amar)",bad:"var(--bad)"})[notaNivel(v)];
  html+=card("Calificación por sesión",todasN.length?`<span class="enota" data-n="${{ok:"alta",cel:"cel",warn:"media",bad:"baja"}[notaNivel(prom)]}" style="font-size:.8rem">Promedio ${coma(prom)}/10 (${todasN.length} ${todasN.length===1?"sesión":"sesiones"})</span>`:"",
    notas.length?barras(notas.map(s=>({v:Math.min(10,s.nota),color:cN(s.nota),label:fechaCorta(s.fecha),tip:`${fechaCorta(s.fecha)} · ${s.titulo} · ${coma(s.nota)}/10`})),{max:10,paso:2,fmt:coma,color:"var(--accent)",refV:prom,refTxt:"Prom. "+coma(prom),refColor:"var(--inf)"})
    +tabla(["Fecha","Sesión","Nota"],todasN.map(s=>[s.fecha,s.titulo,coma(s.nota)]).concat([["Promedio",`${todasN.length} ${todasN.length===1?"sesión":"sesiones"}`,coma(prom)]])):vacio("Aparecerá cuando el instructor ponga la Calificación en tus sesiones."));
  // 2) Dominio de la fase actual (el eje x cubre solo el rango de los datos)
  // Con la lista de 🗺️ Temas, la curva es la misma cuenta que la píldora del inicio (temas en 100% ÷ temas de la fase),
  // desde el cambio a temas: las estimaciones antiguas («Dominio %» > 0) eran otra medida y no se dibujan.
  let conDom=ses.filter(s=>typeof s.dom==="number"),fase=conDom.length?conDom[conDom.length-1].fase:null,dom=conDom.filter(s=>s.fase===fase);
  let dv=s=>s.dom>0&&s.dom<1?s.dom*100:s.dom,subDom="Lo estima el instructor · línea punteada = 50%";
  const fA=faseActual(),tsF=(T.temas||[]).filter(t=>t.fase===fA);
  if(fA&&tsF.length){const fn=String(fA).replace(/\D/g,""),deF=ses.filter(s=>String(s.fase||"")===fn);
    const ult=deF.filter(s=>typeof s.dom==="number"&&s.dom>0).map(s=>s.fecha).sort().pop()||"";
    const dias=[...new Set(deF.map(s=>s.fecha).concat(today()))].filter(f=>f<=today()&&f>ult).sort();
    fase=fn;dom=dias.map(f=>({fecha:f,fase:fn,v:100*tsF.filter(t=>temaPct(t,f)===100).length/tsF.length}));dv=x=>x.v;
    subDom=`Temas en 100% ÷ ${tsF.length} temas de la fase (los % los pone el instructor)${ult?" · desde el cambio a temas":""} · punteada = 50%`}
  html+=card(`Dominio de la Fase ${esc(fase||"")}`,subDom,dom.length?lineas(dom.map(s=>({t:dms(s.fecha),v:dv(s),tip:`${fechaCorta(s.fecha)} · ${Math.round(dv(s))}%`})),{max:100,paso:25,fmt:v=>Math.round(v)+"%",x0:dms(dom[0].fecha)-864e5,x1:Math.max(dms(dom[dom.length-1].fecha)+864e5,dms(dom[0].fecha)+6*864e5),refV:50,refTxt:"50%",color:"var(--dia)"})
    +tabla(["Fecha","Fase","Dominio"],dom.map(s=>[s.fecha,s.fase||"",Math.round(dv(s))+"%"])):vacio("Aparecerá cuando el instructor ponga «Dominio %» en tus sesiones."));
  // 3) Horas reales vs ritmo necesario desde el PRIMER registro de horas (no desde el día 1: las pausas solo desaniman)
  const hs=ses.filter(s=>typeof s.horas==="number");
  if(hs.length){
    const ult=hs[hs.length-1],ini=hs[0],meta=typeof ult.meta==="number"&&ult.meta>0?ult.meta:500,t0=dms(ini.fecha),tE=dms(P_EXAMEN);
    const ideal=t=>ini.horas+(meta-ini.horas)*(t-t0)/Math.max(1,tE-t0),delta=ult.horas-ideal(dms(ult.fecha));
    const x0=dms(ini.fecha)-3*864e5,x1=Math.max(dms(ult.fecha),Date.now())+3*864e5,mx=Math.max(ideal(x1),ult.horas)*1.15;
    const paso=mx>80?20:mx>40?10:5,maxY=Math.ceil(mx/paso)*paso;
    const hero=`<div class="chero"><b class="${delta>=0?"pos":"neg"}">${delta>=0?"+":"−"}${coma(Math.abs(delta))} h</b><span class="muted small">${delta>=0?"adelantado":"atrasado"} respecto al ritmo necesario desde el ${fechaCorta(ini.fecha)} para llegar a ${meta} h el 15 jul 2027</span></div>`;
    html+=card("Horas de estudio","Tus horas reales (instructor) · punteada = ritmo necesario",hero+lineas(hs.map(s=>({t:dms(s.fecha),v:s.horas,tip:`${fechaCorta(s.fecha)} · ${coma(s.horas)} h (necesarias: ${coma(ideal(dms(s.fecha)))} h)`})),{max:maxY,paso,fmt:v=>Math.round(v)+"h",x0,x1,ref2:{t0:x0,v0:ideal(x0),t1:x1,v1:ideal(x1)},color:"var(--unc)"})
      +`<div class="cleg"><span><i style="background:var(--unc)"></i>Tus horas</span><span><i class="dash"></i>Ritmo necesario</span></div>`
      +tabla(["Fecha","Horas reales","Necesarias"],hs.map(s=>[s.fecha,coma(s.horas),coma(ideal(dms(s.fecha)))])));
  }else html+=card("Horas de estudio","",vacio("Aparecerá cuando el instructor ponga «Horas acumuladas» en tus sesiones."));
  // 3b) Simulacros: % total y % de lo enseñado (los anota el instructor; el total decide los checkpoints)
  const sims=(T.sims||[]).filter(x=>typeof x.total==="number"||typeof x.ensenado==="number");
  if(sims.length){
    const st=sims.filter(x=>typeof x.total==="number").map(x=>({t:dms(x.fecha),v:x.total,tip:`${fechaCorta(x.fecha)} · ${x.examen} · total ${Math.round(x.total)}%`}));
    const se=sims.filter(x=>typeof x.ensenado==="number").map(x=>({t:dms(x.fecha),v:x.ensenado,tip:`${fechaCorta(x.fecha)} · ${x.examen} · enseñado ${Math.round(x.ensenado)}%`}));
    const t0=dms(sims[0].fecha)-2*864e5,t1=Math.max(dms(sims[sims.length-1].fecha)+2*864e5,t0+10*864e5);
    html+=card("Simulacros","Los corrige el instructor · punteada = 50% · con 10–20 preguntas, mira la tendencia y no una sola semana",
      lineas(st,{max:100,paso:25,fmt:v=>Math.round(v)+"%",x0:t0,x1:t1,refV:50,refTxt:"50%",color:"var(--accent)",serie2:se,color2:"var(--inf)"})
      +`<div class="cleg"><span><i style="background:var(--accent)"></i>% total</span><span><i style="background:var(--inf)"></i>% de lo enseñado</span></div>`
      +tabla(["Fecha","Examen","% total","% enseñado","No sé"],sims.map(x=>[x.fecha,x.examen,typeof x.total==="number"?Math.round(x.total)+"%":"—",typeof x.ensenado==="number"?Math.round(x.ensenado)+"%":"—",x.nose!=null?String(x.nose):"—"])));
  }else html+=card("Simulacros","",vacio("Aparecerá cuando el instructor corrija tu primer simulacro (Estudio → 📋 Simulacros)."));
  // 4) Aciertos del juego por semana
  const sem={};for(const e of DB.ev)if(e.k==="a"){const k=semana(e.t),o=sem[k]||(sem[k]={n:0,ok:0});o.n++;if(e.o)o.ok++}
  const ks=Object.keys(sem).map(Number).sort((a,b)=>a-b).slice(-8);
  html+=card("Aciertos del juego por semana","Todas las rondas, lecciones y producción",ks.length?barras(ks.map(k=>({v:100*sem[k].ok/sem[k].n,label:fcT(k),tip:`Semana del ${fcT(k)} · ${Math.round(100*sem[k].ok/sem[k].n)}% (${sem[k].ok}/${sem[k].n})`})),{max:100,paso:25,fmt:v=>Math.round(v)+"%",color:"var(--inf)"})
    +tabla(["Semana","Aciertos","Respuestas"],ks.map(k=>[today(new Date(k)),Math.round(100*sem[k].ok/sem[k].n)+"%",String(sem[k].n)])):vacio("Aparecerá cuando juegues tu primera ronda."));
  // 5) Errores más repetidos de la semana
  const top=topErrores();
  html+=`<section class="card"><h3>Tus errores más repetidos (7 días)</h3>${top.length?`<ul class="list">${top.map(x=>`<li>${glyph(BYID[x.k].c)}<span class="t" lang="en">${label(BYID[x.k])}</span><span class="muted small">${x.n}✗</span></li>`).join("")}</ul><button class="btn tk-send" data-act="practicar-top" style="margin-top:10px;width:100%">Practicar estos ${top.length}</button>`:'<span class="muted">Sin errores esta semana. 🎉</span>'}</section>`;
  $("#app").innerHTML=`<div class="stack"><div class="row"><button class="icon-btn" data-act="home" aria-label="Inicio">←</button><b style="font-size:1.15rem">Panel de progreso</b><span class="sp"></span><span class="kbd">Esc</span></div>${html}</div>`;
}

function exportData(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(persisted())],{type:"application/json"}));
  a.download=`mext-forge-respaldo-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
}
$("#imp").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&d.v===2&&Array.isArray(d.ev)){const have=new Set(DB.ev.map(e=>e.i));for(const e of d.ev)if(!have.has(e.i)){DB.ev.push(e);DB.outbox.push(e.i)}}
    else if(d&&d.cats){const e={t:1,k:"b",snap:legacySnap(d)};e.i=DB.dev.id+"-imp-"+rid();e.d=DB.dev.id;DB.ev.push(e);DB.outbox.push(e.i)}
    else throw 0;
    rebuild();save();render();toast("Respaldo importado y fusionado");syncNow()}catch(err){toast("Archivo no válido")}};
  r.readAsText(f);e.target.value=""});
document.addEventListener("click",e=>{
  const tip=e.target.closest&&e.target.closest("[data-tip]");if(tip&&tip.closest(".chart")){verTip(tip);return}
  const t=e.target.closest("button,[data-act]");
  if(!t)return;
  const d=t.dataset;
  if(d.ans!==undefined){if(G&&G.state==="q")answer(+d.ans);return}
  if(d.focus){DB.settings.focus=d.focus;save();renderHome();return}
  if(d.focusGo){start(d.focusGo);return}
  if(d.mode){start(d.mode);return}
  if(d.speed){DB.settings.speed=d.speed;save();render();return}
  if(d.mute){DB.settings.mute=d.mute==="1";save();render();return}
  if(d.theme){DB.settings.theme=d.theme;save();render();return}
  if(d.fondo){if(e.target.closest(".fx"))fondoQuitar(d.fondo);else{fondoUsar(d.fondo==="none"?null:d.fondo);render()}return}
  if(d.dev){DB.dev.name=d.dev;save();render();return}
  switch(d.act){
    case "go":start(DB.settings.focus);break;
    case "again":start(G.key);break;
    case "cont":cont();break;
    case "quit":quit();break;
    case "home":quit();break;
    case "stats":view="stats";render();break;
    case "prog":view="prog";render();break;
    case "practicar-top":start("top");break;
    case "prodcheck":prodCheck();break;
    case "prodbad":answer(0,{ok:false,typed:G.typed});break;
    case "prodok":answer(0,{ok:true,exact:false,typed:G.typed});break;
    case "export":exportData();break;
    case "fondoadd":{const i=document.getElementById("fImg");if(i)i.click();break}
    case "import":$("#imp").click();break;
    case "reset":if(confirm(syncConfigured()?"¿Borrar el progreso de ESTE dispositivo? Lo que ya está en la nube se volverá a descargar al sincronizar.":"¿Borrar todo el progreso, buffer y estadísticas? Exporta un respaldo antes si lo quieres conservar.")){const keep=DB.settings;DB=fresh();DB.settings=keep;derivedReset(DB);save();render();toast("Progreso borrado");syncNow()}break;
    case "syncpill":{const det=document.querySelector("details.card");if(!syncConfigured()&&det){det.open=true;det.scrollIntoView({behavior:"smooth"})}else syncNow(true);break}
    case "syncsave":DB.settings.syncUrl=$("#sUrl").value.trim();DB.settings.syncKey=$("#sKey").value.trim();save();
      if(!syncConfigured()){toast("Sincronización desactivada");render()}else syncNow(true);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="prodIn"){if(e.key==="Enter"&&!e.isComposing){e.preventDefault();prodCheck()}else if(e.key==="Escape")quit();return} // Enter comprueba (no durante el IME)
  if(e.target.closest&&e.target.closest("summary,input,textarea"))return;
  if(view==="sim"||view==="simu"){if(e.key==="Escape"){view=view==="simu"?"sim":"tareas";render()}return}
  if(view==="tareas"||view==="tarea"||view==="ref"||view==="mat"){if(e.key==="Escape"){if(view==="tarea"||view==="ref"||view==="mat"){if(view==="tarea"){addItemTime();pauseAll(tDate);tSave(true)}view="tareas";renderTareas()}else quit()}return}
  const k=e.key.toLowerCase();
  if(e.key==="Escape"){quit();return}
  if(view==="home"){if(e.key==="Enter"){e.preventDefault();start(DB.settings.focus)}else if(k==="s"){view="stats";render()}else if(k==="p"){view="prog";render()}return}
  if(view==="stats"||view==="prog"){return}
  if(view==="end"){if(e.key==="Enter"){e.preventDefault();start(G.key)}return}
  if(view==="drill"&&G){
    if(G.state==="judge"){if(k==="1"){e.preventDefault();answer(0,{ok:false,typed:G.typed})}else if(k==="2"){e.preventDefault();answer(0,{ok:true,exact:false,typed:G.typed})}return}
    if(G.state==="q"&&G.it.k==="W")return;
    if(G.state==="q"){
      let i=-1;if(k.length===1&&"1234".includes(k))i=+k-1;else if(k.length===1&&"abcd".includes(k))i="abcd".indexOf(k);
      const max=G.it.k==="E"?4:G.it.o.length;
      if(i>=0&&i<max){e.preventDefault();answer(i)}
    }else if(e.key==="Enter"||e.key===" "){e.preventDefault();cont()}
  }
});
document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest(".chart [data-tip]");if(t)verTip(t)});
document.addEventListener("visibilitychange",()=>{
  if(G&&G.state==="q"&&!document.hidden){G.last=performance.now();cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(tick)}

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  const hadSW = !!navigator.serviceWorker.controller;
  let pending = false, done = false;
  const focused = () => { const a = document.activeElement; return !!(a && a.closest && a.closest("input,textarea")); };
  const busy = () => false; // se aplica enseguida: antes de recargar se guardan las respuestas (tSave)
  const tryReload = () => {
    if (!pending || done || busy()) return;
    done = true;
    try { if (typeof tSave === "function") tSave(true); } catch (e) {}
    location.reload();
  };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadSW) return; pending = true; tryReload(); });
  setInterval(tryReload, 5000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    tryReload();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // versión nueva: se revisa cada minuto mientras la app está a la vista (antes solo al volver a abrirla)
  const check = () => navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  setInterval(() => { if (!document.hidden) check(); }, 60000);
  window.addEventListener("online", check);
}
</script>
