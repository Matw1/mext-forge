<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEXT Forge se mudó</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;font:17px/1.5 system-ui,sans-serif;background:#0c0e1b;color:#f2efe8}a{color:#ff7aa8;font-weight:700}</style>
</head>
<body>
<main><h1>📦 MEXT Forge se mudó</h1><p>Ahora vive en <a href="https://mext-forge.mext-rafaga-sync.workers.dev/">mext-forge.mext-rafaga-sync.workers.dev</a>.</p><p id="m">Te llevo allí…</p></main>
<script>
// Página fija de la dirección vieja: no se actualiza más. Lleva a la nueva y, cuando la nueva toca
// «Traer mis datos», le entrega los datos que quedaron guardados aquí (solo a esa dirección).
const NUEVA = "https://mext-forge.mext-rafaga-sync.workers.dev";
if (new URLSearchParams(location.search).get("exportar") === "1" && window.opener) {
  const d = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("mextforge.")) d[k] = localStorage.getItem(k); }
  window.opener.postMessage({ forgeMudanza: d }, NUEVA);
  document.getElementById("m").textContent = "✅ Datos enviados a la app nueva. Puedes cerrar esta pestaña.";
  setTimeout(() => window.close(), 1800);
} else setTimeout(() => location.replace(NUEVA + "/"), 2500);
// La app vieja quedó guardada en el teléfono: se quita su service worker y su caché (no toca los de Ráfaga).
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.includes("/mext-forge/")) r.unregister(); }));
if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith("mext-forge-")).forEach(k => caches.delete(k)));
</script>
</body>
</html>
