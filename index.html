<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MEXT Forge</title>
<link rel="icon" type="image/png" href="icon-192.png?v=mv63w3m5">
<link rel="manifest" href="manifest.webmanifest?v=mv63w3m5">
<link rel="apple-touch-icon" href="icon-192.png?v=mv63w3m5">
<style>
/* ===== Tema 和紙 (claro) ===== */
:root{--bg:#f6f0e4;--surface:#fffdf8;--surface2:#f2eadb;--text:#211b17;--muted:#74695e;--line:#e4d8c4;
  --accent:#d6336c;--accent2:#b07d12;--accent-t:#fff;--ok:#1d8a50;--okbg:#e2f3e8;--bad:#c9302c;--badbg:#fbe6e2;--warn:#b26b00;--warnbg:#fbefd9;--focus:#d63a2f;
  --glow:rgba(214,51,108,.16);--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --cop:#d63a2f;--inf:#2457d6;--neg:#7348d1;--unc:#1c9459;--ind:#bb7400;--c1:#0b8aa3;--mix:#211b17;--buf:#b26b00;--fos:#c23c7c;--dia:#4f46e5}
/* ===== Tema 夜 (oscuro) ===== */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff7aa8;--accent2:#ffc857;--accent-t:#2a0714;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,122,168,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --cop:#ff6b5e;--inf:#8fb0ff;--neg:#ad90ff;--unc:#4fe090;--ind:#ffb84d;--c1:#3cc8e6;--mix:#f2efe8;--buf:#ffb347;--fos:#ff7ab6;--dia:#a5b4fc}}
:root[data-theme="dark"]{--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff7aa8;--accent2:#ffc857;--accent-t:#2a0714;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,122,168,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --cop:#ff6b5e;--inf:#8fb0ff;--neg:#ad90ff;--unc:#4fe090;--ind:#ffb84d;--c1:#3cc8e6;--mix:#f2efe8;--buf:#ffb347;--fos:#ff7ab6;--dia:#a5b4fc}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);background-color:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100dvh;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--pat,none);background-attachment:fixed}
#app{max-width:780px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.center{text-align:center}
.hide{display:none!important}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card h3{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kbd{font-family:ui-monospace,monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* ===== Marca ===== */
.brand{display:flex;align-items:center;gap:10px}
.hanko{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:900;font-size:1.25rem;transform:rotate(-4deg);box-shadow:0 4px 14px var(--glow)}
.brand b{display:block;font-size:1.15rem;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:.78rem}

/* ===== Hero ===== */
.hero{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{position:relative;flex:none;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .in b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.ring .in small{font-size:.7rem;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hero .h{font-size:1.05rem;font-weight:700;margin:4px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}

/* ===== Botón principal ===== */
.start{position:relative;width:100%;margin-top:16px;border:0;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;
  background:linear-gradient(120deg,#f2669a,#d6336c 55%,#8e1f5a);box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.start::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.start .play{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.4rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.start b{display:block;font-size:1.3rem}
.start small{opacity:.85;font-size:.85rem}
.start:active{transform:scale(.99)}

/* ===== Mosaicos ===== */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--c)}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c),var(--shadow)}
.glyph{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.95rem;letter-spacing:-.02em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:6px;flex:none}
.mode .mn{font-weight:800;font-size:.98rem}
.mode .ms{font-size:.74rem;color:var(--muted);line-height:1.25}
.mode .acc{position:absolute;top:12px;right:12px;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.mode .mb{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.9}
.mode .badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--c);color:var(--bg);font-size:.75rem;font-weight:900;display:grid;place-items:center}

/* ===== Regla del día ===== */
.rule-day{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--c)}
.rule-day .glyph{margin:0}
.rule-day p{margin:2px 0 8px;font-size:.98rem;font-weight:600}
.rule-day .wm{position:absolute;right:-4px;bottom:-30px;font-size:6.5rem;font-weight:900;color:var(--c);opacity:.07;pointer-events:none;line-height:1}

/* ===== Medidores ===== */
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)} .meter i.none{background:var(--line)}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0;padding-top:2px}
.catrow .glyph{margin:0;grid-row:span 2}
.catrow .meter,.catrow .sub{grid-column:2/-1}
.catrow .sub{font-size:.75rem;color:var(--muted)}
.pct{font-variant-numeric:tabular-nums;font-weight:800}

/* ===== Ajustes ===== */
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details[open].card summary::after{content:"－"}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:.9rem}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}

/* ===== Drill ===== */
.hud{display:flex;align-items:center;gap:10px;position:relative}
.score{line-height:1}
.score b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.score small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.float{position:absolute;left:58px;top:-6px;font-weight:900;color:var(--accent2);font-size:1.1rem;pointer-events:none;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.combo{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:900;font-variant-numeric:tabular-nums;color:#2a1a00;background:linear-gradient(135deg,#ffe08a,#ffb547);box-shadow:0 4px 16px rgba(255,181,71,.35);animation:bump .3s}
.combo.hot{color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff3d5a);box-shadow:0 4px 20px rgba(255,61,90,.45)}
@keyframes bump{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.lives{font-weight:900;letter-spacing:2px;color:var(--bad)}
.tring{position:relative;width:48px;height:48px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.tring.low circle.fg{stroke:var(--bad)}
.tring.low span{color:var(--bad)}
.qcard{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px 0;box-shadow:var(--shadow);overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.qcard .wm{position:absolute;right:-6px;bottom:-26px;font-size:7.5rem;font-weight:900;color:var(--c);opacity:.07;pointer-events:none;line-height:1}
.qcard.pop{animation:okpulse .45s}
@keyframes okpulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 16px transparent}}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--c,var(--muted))}
.tag.buf{--c:var(--warn)}
.tag.fos{--c:var(--fos)}
.head{font-size:.84rem;color:var(--muted);text-align:center;margin-top:10px}
.prompt{position:relative;font-size:1.4rem;line-height:2.6;padding:10px 4px 22px;text-align:center;overflow-wrap:anywhere}
.prompt.rb{line-height:1.8;padding-bottom:18px}
.blank{display:inline-block;min-width:3em;color:var(--c);font-weight:800;white-space:nowrap;border-bottom:3px solid var(--c);line-height:1.2}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.segm{position:relative;border:0;background:color-mix(in srgb,var(--c) 9%,transparent);border-bottom:3px solid var(--c);border-radius:6px 6px 2px 2px;padding:0 5px;line-height:1.5;font-size:inherit;transition:background .12s}
.segm:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.segm .k{position:absolute;left:50%;transform:translateX(-50%);bottom:-1.45em;font-size:.6rem;font-weight:900;color:var(--muted);line-height:1}
.segm.ok{background:var(--okbg);border-color:var(--ok);animation:pop .35s}
.segm.ok .k{color:var(--ok)}
.segm.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.segm.bad .k{color:var(--bad)}
.segm.dim{opacity:.45}
.prompt.shake{animation:shake .38s}
.qtimer{height:5px;background:var(--surface2);margin:0 -16px}
.qtimer i{display:block;height:100%;width:100%;background:var(--ok);transition:background .3s}
.qtimer i.mid{background:var(--warn)} .qtimer i.low{background:var(--bad)}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:62px;font-size:1.15rem;line-height:1.4;box-shadow:var(--shadow);transition:transform .08s,border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:.85rem;display:grid;place-items:center;font-weight:800;transition:background .12s,color .12s}
.opt:hover .k{background:var(--c);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .35s}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.4;box-shadow:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opts.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fb{display:flex;gap:12px;margin-top:14px;border-radius:18px;padding:14px;background:var(--surface);border:1.5px solid var(--bad);box-shadow:0 8px 26px var(--badbg);animation:rise .25s ease-out;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bad);color:var(--bg);display:grid;place-items:center;font-weight:900}
.fb .h{font-size:.92rem;color:var(--muted);margin-bottom:6px}
.fb .h b{color:var(--text)}
.fb .fix{font-size:1.08rem;font-weight:600;margin:0 0 6px}
.fix ins{text-decoration:none;color:var(--ok);font-weight:800;border-bottom:2px solid var(--ok)}
.fb .r2{margin:0;color:var(--muted)}
.fb .r2 b{color:var(--text)}
.fosbox{border-radius:12px;padding:8px 10px;margin:0 0 8px;background:color-mix(in srgb,var(--fos) 13%,transparent);border:1px solid color-mix(in srgb,var(--fos) 45%,transparent)}
.fosbox b{display:block;color:var(--fos);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.fb .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--muted)}
.fb .go-on{margin-left:auto;font-weight:800;color:var(--text);background:var(--surface2);border-radius:99px;padding:6px 14px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:var(--fos);transition:opacity .35s;z-index:8}

/* ===== Final ===== */
.endhero{position:relative;text-align:center;padding:26px 16px 20px;border-radius:24px;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.stamp{width:108px;height:108px;margin:0 auto 10px;border:5px solid var(--focus);border-radius:50%;display:grid;place-items:center;color:var(--focus);font-size:3.1rem;font-weight:900;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 5px var(--focus)}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.stamp-l{font-weight:800;color:var(--focus);letter-spacing:.08em;font-size:.82rem}
.big{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted)}
.proj{display:flex;gap:12px;align-items:center;border-left:4px solid var(--c)}
.proj b{font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--c)}
.cta{display:flex;gap:10px}
.cta .start{margin-top:0;flex:2;padding:16px}
.cta .btn{flex:1;border-radius:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
.miss{padding:10px 0;border-top:1px solid var(--line)}
.miss:first-of-type{border-top:0;padding-top:0}
.miss .fix{font-weight:600;margin:0 0 3px}
.miss .r{font-size:.84rem;color:var(--muted)}

/* ===== Listas ===== */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.list li:first-child{border-top:0}
.list li .glyph{margin:0}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{letter-spacing:2px;color:var(--warn);font-size:.8rem;white-space:nowrap}

.pill[data-s]{cursor:pointer}
.pill[data-s="ok"]{color:var(--ok)}.pill[data-s="warn"]{color:var(--warn)}.pill[data-s="bad"]{color:var(--bad)}.pill[data-s="muted"]{color:var(--muted)}
.syncbox{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.syncbox label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.syncbox input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== Pestañas Juego / Estudio (como en MEXT Ráfaga) ===== */
.tabs{display:flex;gap:6px;padding:4px;margin-bottom:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;min-height:44px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.estat{font-size:.82rem;margin:6px 0 14px;color:var(--muted)}

.ehead1{font-size:1.2rem;margin:0}

.lessons{display:grid;gap:10px}
.lesson{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:64px;box-shadow:var(--shadow);overflow:hidden}

/* ================= STORAGE: registro de eventos =================
   Igual que MEXT Ráfaga: la fuente de verdad es DB.ev (cada respuesta 'a', cada ronda 's',
   progreso anterior a la sincronización 'b'). cats/items/buffer/sessions/best… son DERIVADOS:
   se reconstruyen reproduciendo los eventos en orden (t, i), así dos dispositivos que
   practicaron sin conexión se fusionan sin conflictos. */
const KEY="mextforge.v1";
const rid=()=>Math.random().toString(36).slice(2,10);

  settings:{speed:"warm",mute:false,theme:"auto",focus:"mix",syncUrl:"",syncKey:""}});
function derivedReset(d){d.cats={};d.items={};d.buffer={};d.sessions=[];d.fossils=0;d.best={score:0,combo:0};d.bestMode={}}
let DB=fresh();derivedReset(DB);
const cs=c=>{const s=DB.cats[c]||(DB.cats[c]={n:0,w:0,to:0,ms:0,f:0});if(!s.r)s.r=[];return s};
// Aplica un evento al estado derivado. Devuelve {freed} si sacó un ejercicio del buffer.
function applyEvent(e){
  if(e.k==="a"){
    const it=BYID[e.q],cat=it?it.c:(String(e.q).startsWith("d:")?"DIA":null);if(!cat)return{};
    const s=cs(cat),ok=!!e.o;
    s.n++;s.ms+=e.ms||0;s.r.push(ok?1:0);if(s.r.length>15)s.r.shift();
    const is=DB.items[e.q]||(DB.items[e.q]={w:0,c:0});is.n=(is.n||0)+1;if(ok)is.ok=(is.ok||0)+1;
    if(ok){is.c++;const b=DB.buffer[e.q];if(b){b.s++;if(b.s>=3){delete DB.buffer[e.q];return{freed:true}}}}
    else{s.w++;is.w++;is.c=0;if(e.to)s.to++;if(e.f){s.f++;DB.fossils++}
      const b=DB.buffer[e.q];DB.buffer[e.q]={s:0,f:(b?b.f:0)+1}}
    return{};
  }
  if(e.k==="s"){
    DB.sessions.push({d:today(new Date(e.t)),ts:e.t,m:e.m,acc:e.n?Math.round(100*e.ok/e.n):0,s:e.sc,n:e.n,ok:e.ok,dn:e.dn});
    DB.best.score=Math.max(DB.best.score,e.sc||0);DB.best.combo=Math.max(DB.best.combo,e.cb||0);
    if(e.n)DB.bestMode[e.m]=Math.max(DB.bestMode[e.m]||0,e.sc||0);
    return{};
  }
  if(e.k==="b"){ // progreso anterior a la sincronización: se SUMA al de los demás dispositivos
    const p=e.snap||{};
    for(const[c,v]of Object.entries(p.cats||{})){if(!CATS[c])continue;const st=cs(c);st.n+=v.n||0;st.w+=v.w||0;st.to+=v.to||0;st.ms+=v.ms||0;st.f+=v.f||0;st.r=st.r.concat(v.r||[]).slice(-15)}
    for(const[k,v]of Object.entries(p.items||{})){if(!BYID[k])continue;const it=DB.items[k];if(!it)DB.items[k]={w:v.w||0,c:v.c||0};else{it.w+=v.w||0;it.c=Math.max(it.c,v.c||0)}}
    for(const[k,v]of Object.entries(p.buffer||{}))if(BYID[k]&&!DB.buffer[k])DB.buffer[k]={s:v.s||0,f:v.f||1};
    DB.sessions=DB.sessions.concat(p.sessions||[]);DB.fossils+=p.fossils||0;
    const bs=p.best||{};DB.best.score=Math.max(DB.best.score,bs.score||0);DB.best.combo=Math.max(DB.best.combo,bs.combo||0);
    for(const[k,v]of Object.entries(p.bestMode||{}))DB.bestMode[k]=Math.max(DB.bestMode[k]||0,+v||0);
    return{};
  }
  return{};
}
const evCmp=(a,b)=>a.t-b.t||(a.i<b.i?-1:a.i>b.i?1:0);
function rebuild(){derivedReset(DB);DB.ev.sort(evCmp);for(const e of DB.ev)applyEvent(e);DB.sessions.sort((a,b)=>(a.ts||0)-(b.ts||0))}
function addLocal(e){e.i=DB.dev.id+"-"+e.t.toString(36)+"-"+rid().slice(0,4);e.d=DB.dev.id;DB.ev.push(e);DB.outbox.push(e.i);return applyEvent(e)}

function legacySnap(o){
  let best=o.best||{},bestMode=o.bestMode||{};
  if(typeof best.score!=="number"){bestMode=best;best={score:Math.max(0,...Object.values(best).map(Number).filter(n=>!isNaN(n))),combo:0}}
  return {cats:o.cats,items:o.items,buffer:o.buffer,sessions:o.sessions,fossils:o.fossils,best,bestMode};
}

/* ================= SYNC (Worker → D1 → Notion) =================
   Sin conexión todo funciona: los eventos esperan en DB.outbox. Nunca se sincroniza durante una ronda. */
let syncState="off",syncBusy=false;
function syncConfigured(){return !!(DB.settings.syncUrl&&DB.settings.syncKey)}
async function syncNow(manual){
  if(!syncConfigured()){syncState="off";return}
  if(syncBusy||view==="drill")return;
  if(typeof navigator!=="undefined"&&navigator.onLine===false){syncState="offline";refreshSync();return}
  syncBusy=true;syncState="busy";refreshSync();
  try{
    let more=true,changed=false,guard=0;
    while(more&&guard++<20){
      const ids=new Set(DB.outbox),out=DB.ev.filter(e=>ids.has(e.i)).slice(0,1000);
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);
      const r=await fetch(DB.settings.syncUrl.replace(/\/+$/,"")+"/sync",{method:"POST",signal:ctl.signal,
        headers:{"Authorization":"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"},
        body:JSON.stringify({dev:DB.dev.id,since:DB.cursor,events:out})});
      clearTimeout(to);
      if(r.status===401){syncState="badkey";break}
      if(!r.ok)throw new Error("HTTP "+r.status);
      const res=await r.json(),sent=new Set(out.map(e=>e.i));
      DB.outbox=DB.outbox.filter(i=>!sent.has(i));
      const have=new Set(DB.ev.map(e=>e.i));
      for(const e of res.events||[])if(!have.has(e.i)){DB.ev.push(e);have.add(e.i);changed=true}
      DB.cursor=res.cursor||DB.cursor;more=!!res.more||DB.outbox.length>0;
      syncState="ok";DB.lastSync=Date.now();
    }
    if(changed&&view!=="drill")rebuild();
    save();if(manual)toast(syncState==="ok"?"☁ Sincronizado":"⚠ Clave inválida");
  }catch(err){syncState=navigator.onLine===false?"offline":"error";if(manual)toast("No se pudo sincronizar: "+(err.name==="AbortError"?"sin respuesta":err.message))}
  finally{syncBusy=false;if(view==="home"||view==="stats"||view==="end")render();else{refreshSync();if(view==="tarea"&&typeof renderTarea==="function"&&!document.activeElement.closest(".tk-item"))renderTarea(true)}}
}
function syncLabel(){
  if(!syncConfigured())return["☁︎ Sin nube","muted"];
  const p=DB.outbox.length;
  if(syncState==="busy")return["☁ Sincronizando…",""];
  if(syncState==="offline")return[`○ Sin conexión${p?" · "+p+" pend.":""}`,"warn"];
  if(syncState==="badkey")return["⚠ Clave inválida","bad"];
  if(syncState==="error")return[`⚠ Error de sync${p?" · "+p+" pend.":""}`,"bad"];
  if(p)return[`☁ ${p} pendientes`,"warn"];
  return["☁ Sincronizado","ok"];
}
function refreshSync(){const el=document.getElementById("syncPill");if(el){const[t,c]=syncLabel();el.textContent=t;el.dataset.s=c}}

function tone(f,d,type,vol,when,f2){const a=ac();if(!a||DB.settings.mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);

/* ================= SESSION ================= */
let G=null;
function weightOf(it,blind){
  const s=DB.items[it.id]||{w:0,c:0};
  let w=1+s.w*2-Math.min(s.c,4)*.2;
  if(blind)w*=1+errRate(it.c)*8;
  return Math.max(.15,w);
}
function pick(pool,n,blind,exclude){
  const out=[],cand=pool.filter(x=>!(exclude&&exclude.has(x.id)));
  while(out.length<n&&cand.length){
    const ws=cand.map(x=>weightOf(x,blind));let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    while(i<ws.length-1&&r>ws[i]){r-=ws[i];i++}
    out.push(cand.splice(i,1)[0]);
  }
  return out;
}
function bufItems(filter){return Object.keys(DB.buffer).map(id=>BYID[id]).filter(x=>x&&(!filter||filter(x)))}
function buildQueue(key){
  let pool,blind=false,lead=[];
  if(key==="buf"){const b=shuffle(bufItems());return b.slice(0,ROUND)}
  if(key==="days"){const L=shuffle(LESSONS.slice());return L.slice(0,20)}
  if(String(key).startsWith("day:")){const d=key.slice(4);return shuffle(LESSONS.filter(x=>x.L===d)).slice(0,20)}
  if(key==="mix"){pool=allItems();blind=true;lead=shuffle(bufItems()).slice(0,3)}
  else if(CATS[key]){pool=ITEMS.filter(x=>x.c===key);lead=shuffle(bufItems(x=>x.c===key)).slice(0,3)}
  else if(key==="hunter")pool=ITEMS.filter(x=>x.k==="E");
  else if(key==="rebuild")pool=ITEMS.filter(x=>x.k==="R");
  else if(key==="fossil")pool=ITEMS.filter(x=>x.fos);
  else if(key==="death")pool=allItems();
  const ex=new Set(lead.map(x=>x.id));
  return shuffle(lead).concat(pick(pool,(key==="death"?20:ROUND)-lead.length,blind,ex));
}
function start(key,custom){
  ac();
  const queue=custom||buildQueue(key);
  if(!queue.length){toast(key==="buf"?"Buffer vacío. Nada pendiente ✨":"No hay ejercicios aquí");return}
  G={key,sid:DB.dev.id+"-"+Date.now().toString(36),queue,pool:key==="death"?ITEMS:null,death:key==="death",idx:0,score:0,combo:0,maxCombo:0,lives:3,res:[],speedMul:1,freed:0,state:"q",raf:0,timer:0,byCat:{}};
  view="drill";nextQ();
}
function limitFor(it){const sp=SPEEDS[DB.settings.speed];return (it.k==="E"?sp.eh:sp.rb)*G.speedMul}
function nextQ(){
  clearTimeout(G.timer);
  if(G.death){
    if(G.lives<=0)return finish();
    if(G.idx>=G.queue.length)G.queue.push(...pick(allItems(),15,false,new Set(G.queue.slice(-10).map(x=>x.id))));
  }
  while(G.idx<G.queue.length&&!BYID[G.queue[G.idx].id])G.idx++; // lecciones que el instructor borró
  if(G.idx>=G.queue.length)return finish();
  const it=G.it=G.queue[G.idx];
  if(it.L&&it.all.length>4){const c=it.all.find(o=>o.ok);it.o=[c.t].concat(shuffle(it.all.filter(o=>!o.ok)).slice(0,3).map(o=>o.t))}

const RC=2*Math.PI*20;
function tick(t){
  if(view!=="drill"||!G||G.state!=="q")return;
  const dt=t-G.last;G.last=t;
  if(!document.hidden)G.qEl+=dt;
  if(G.qEl>=G.limit)return answer(-1);
  updateClock();
  G.raf=requestAnimationFrame(tick);
}
function updateClock(){
  const fg=$("#tfg"),tx=$("#ttx"),tr=$("#tring"),qt=$("#qt");
  const p=G.state==="q"?Math.max(0,1-G.qEl/G.limit):0;
  if(fg)fg.style.strokeDashoffset=RC*(1-p);
  if(tx)tx.textContent=G.state==="q"?Math.ceil((G.limit-G.qEl)/1000):"";
  if(tr)tr.classList.toggle("low",p<.3);
  if(qt){qt.style.width=(100*p)+"%";qt.className=p<.25?"low":p<.5?"mid":""}
}
function answer(choice){
  if(!G||G.state!=="q")return;
  cancelAnimationFrame(G.raf);
  const it=G.it,ms=Math.min(G.qEl,G.limit),timeout=choice<0;
  const orig=it.k==="R"&&!timeout?G.order[choice]:choice;
  const ok=!timeout&&(it.k==="E"?choice===it.e:orig===0);
  let fos=null;
  if(!ok){if(it.k==="E")fos=fossilOf(clean(it.t));else if(!timeout)fos=fossilOf(fill(it.q,it.o[orig]))}
  // evento de respuesta (fuente de verdad); el estado derivado se actualiza al aplicarlo
  const bc=G.byCat[it.c]||(G.byCat[it.c]={n:0,ok:0});bc.n++;if(ok)bc.ok++;
  // detalle para el instructor: pregunta, lo que respondió y lo correcto (unido a la ronda por sid)
  const segs=it.k==="E"?it.t.match(/\[([^\]]+)\]/g).map(x=>x.slice(1,-1)):null;
  const det={c:it.c,sid:G.sid,pr:it.k==="E"?clean(it.t):it.q,ch:timeout?"":it.k==="E"?segs[choice]:it.o[orig],cr:it.k==="E"?segs[it.e]+" → "+it.fx:it.o[0]};
  if(addLocal(Object.assign({t:Date.now(),k:"a",q:it.id,o:ok?1:0,ms:Math.round(ms),to:timeout?1:0,f:fos?1:0},det)).freed)G.freed++;
  save();
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const mult=1+Math.min(4,Math.floor(G.combo/3))*.5;
    G.gain=Math.round((100+100*(1-ms/G.limit))*mult);G.score+=G.gain;
    if(G.death)G.speedMul=Math.max(.55,G.speedMul*.95);
    (G.combo%3===0?SFX.combo:SFX.ok)();
  }else{G.combo=0;if(G.death)G.lives--;
    if(fos){SFX.fossil();const f=$("#flash");f.style.opacity=".18";setTimeout(()=>f.style.opacity="0",180)}else SFX.bad();
  }
  G.res.push({it,ok,ms,timeout,fos});
  G.state="fb";G.chosen=choice;G.ok=ok;G.fos=fos;G.timeout=timeout;G.fbAt=performance.now();
  renderDrill();
  if(ok)G.timer=setTimeout(cont,650);
}
function cont(){if(!G||G.state!=="fb")return;if(!G.ok&&performance.now()-G.fbAt<350)return;clearTimeout(G.timer);G.idx++;nextQ()}
function quit(){if(G){clearTimeout(G.timer);cancelAnimationFrame(G.raf)}G=null;view="home";render()}
function finish(){
  const r=G.res,n=r.length,good=r.filter(x=>x.ok).length,acc=n?good/n:0;
  G.record=n&&G.score>(DB.best.score||0);
  if(n){
    const now=new Date(),off=-now.getTimezoneOffset(),pad=x=>String(Math.abs(x)).padStart(2,"0");
    const iso=today(now)+"T"+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds())+(off>=0?"+":"-")+pad(Math.trunc(off/60))+":"+pad(off%60);
    const by={};for(const c in G.byCat)by[c]=[G.byCat[c].ok,G.byCat[c].n];
    addLocal({t:now.getTime(),k:"s",sid:G.sid,m:G.key,mn:modeLabel(G.key),n,ok:good,sc:G.score,cb:G.maxCombo,fr:G.freed,bc:Object.keys(DB.buffer).length,fo:r.filter(x=>x.fos).length,by,iso,dn:DB.dev.name});
    save();
  }
  SFX.end();
  G.acc=acc;G.n=n;G.good=good;view="end";render();
  syncNow();
}

/* ================= TAREAS DIARIAS (instructor) =================
   Sección separada del juego: sin puntos, rachas ni corrección automática.
   El instructor escribe la sesión en Notion (sección «📝 Tareas diarias (app)», un desplegable por fecha);
   el Worker la entrega a la app; la app la guarda para usarla sin conexión, cronometra y entrega.
   La entrega viaja como evento 't' por la misma cola que el juego (sin conexión espera y se reenvía). */
const TK="mextforge.tareas.v1";
let T={list:[],ses:{},ans:{},tm:{},out:{},edit:{},hb:0,at:0};
try{const o=JSON.parse(localStorage.getItem(TK));if(o)T=Object.assign(T,o)}catch(e){}
let tSaveH=0;
function tSave(now){clearTimeout(tSaveH);const f=()=>{try{localStorage.setItem(TK,JSON.stringify(T))}catch(e){}};if(now)f();else tSaveH=setTimeout(f,300)}
let tDate=null,tState="idle",tErr="";

// Marcas que reconoce la app al inicio de un título del instructor (### o ##)
const TMARK=[["📘","ref","Consulta"],["✍","write","Escritura"],["🔁","trans","Traducción"],["🛠","fix","Corrección"],["🧩","cloze","Completar"],
  ["🔤","vocab","Vocabulario"],["📖","read","Lectura"],["🎧","dict","Dictado"],["🗣","oral","Producción oral"],["🎯","mastery","Prueba de dominio"],
  ["⏱","mock","Simulacro"],["✅","out","Fuera de la app"],["🧑‍🏫","retro","Retroalimentación"],["📤","entrega","Entrega"],["🎮","juego","Juego"]];
const TLONG=new Set(["write","trans","fix","read","dict","oral"]);
const nfe=s=>String(s).replace(/️/g,"");
const rtPlain=r=>(r||[]).map(x=>x.t).join("");
function rtHtml(r){return (r||[]).map(x=>{let h=esc(x.t);if(x.c)h=`<code>${h}</code>`;if(x.b)h=`<b>${h}</b>`;if(x.i)h=`<i>${h}</i>`;if(x.s)h=`<s>${h}</s>`;if(x.u)h=`<u>${h}</u>`;
  if(x.h&&/^https?:/i.test(x.h))h=`<a href="${esc(x.h)}" target="_blank" rel="noopener">${h}</a>`;return h}).join("").replace(/___+/g,'<span class="gap">___</span>')}
function markOf(text){const t=nfe(text).trim();for(const[e,ty,n]of TMARK)if(t.startsWith(nfe(e)))return{ty,n};return null}
const isList=ty=>ty==="bulleted_list_item"||ty==="numbered_list_item"||ty==="to_do";

// Bloques de Notion → {intro, acts:[{key,ty,n,title,min,blocks}], retro:[]}
function parseSession(blocks){
  const res={intro:[],acts:[],retro:[],juego:[]};let cur=null,zone="intro";
  for(const b of blocks||[]){
    if(/^heading_/.test(b.ty)){const m=markOf(rtPlain(b.r));
      if(m){
        if(m.ty==="retro"){zone="retro";cur=null;continue}
        if(m.ty==="entrega"){zone="skip";cur=null;continue}
        if(m.ty==="juego"){zone="juego";cur=null;continue}
        let title=nfe(rtPlain(b.r)).replace(/^\S+\s*/,"").trim();const mm=title.match(/(\d+)\s*min\b/i);
        if(title.includes(":"))title=title.slice(title.indexOf(":")+1).trim(); // «Consulta: tema» → «tema»
        cur={key:b.id,ty:m.ty,n:m.n,title:title.replace(/\s*·\s*\d+\s*min\b.*$/i,"")||m.n,min:mm?+mm[1]:null,blocks:[]};
        res.acts.push(cur);zone="act";continue}
    }
    if(zone==="skip")continue;
    if(zone==="juego"){res.juego.push(b);continue}
    if(zone==="retro")res.retro.push(b);else if(zone==="act")cur.blocks.push(b);else res.intro.push(b);
  }
  res.retro=res.retro.filter(b=>!/retroalimentaci[oó]n pendiente/i.test(rtPlain(b.r)));
  return res;
}
function splitOpts(r){const s=rtPlain(r),m=s.match(/\{([^{}]*\|[^{}]*)\}\s*$/);
  if(!m)return{r,opts:null};const cut=s.length-m[0].length;let n=0;const r2=[];
  for(const x of r){if(n>=cut)break;r2.push(Object.assign({},x,{t:x.t.slice(0,cut-n)}));n+=x.t.length}
  return{r:r2,opts:m[1].split("|").map(o=>o.trim()).filter(Boolean)}}
// Bloques que solo se leen
function blockHtml(b){
  const k=b.k&&b.k.length?b.k.map(blockHtml).join(""):"";
  switch(b.ty){
    case "paragraph":return `<p>${rtHtml(b.r)}</p>${k}`;
    case "heading_1":case "heading_2":case "heading_3":return `<h4>${rtHtml(b.r)}</h4>${k}`;
    case "quote":return `<blockquote>${rtHtml(b.r)}${k}</blockquote>`;
    case "callout":return `<div class="tk-callout">${b.ic?b.ic+" ":""}${rtHtml(b.r)}${k}</div>`;
    case "code":return `<pre>${esc(rtPlain(b.r))}</pre>`;
    case "divider":return "<hr>";
    case "bulleted_list_item":case "numbered_list_item":return `<ul><li>${rtHtml(b.r)}${k}</li></ul>`;
    case "to_do":return `<ul><li>${b.ck?"☑":"☐"} ${rtHtml(b.r)}${k}</li></ul>`;
    case "toggle":return `<details><summary>${rtHtml(b.r)}</summary>${k}</details>`;
    case "table":return `<div class="tk-table"><table>${(b.k||[]).map((row,i)=>`<tr>${(row.cells||[]).map(c=>i===0&&b.hr?`<th>${rtHtml(c)}</th>`:`<td>${rtHtml(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
    default:return b.r?`<p>${rtHtml(b.r)}</p>${k}`:"";
  }
}

/* ---------- estado por fecha ---------- */
const tAns=(d,id)=>{const a=T.ans[d]||(T.ans[d]={});return a[id]||(a[id]={v:"",ch:null,d:0,nt:"",h:"nada",s:0})};
const tOut=(d,id)=>{const a=T.out[d]||(T.out[d]={});return a[id]||(a[id]={done:false,min:""})};
const tTm=(d,k)=>{const a=T.tm[d]||(T.tm[d]={});return a[k]||(a[k]={acc:0,since:null})};
const tEl=t=>t.acc+(t.since?Date.now()-t.since:0);
const entregasDe=d=>DB.ev.filter(e=>e.k==="t"&&e.date===d).sort((a,b)=>a.t-b.t);
const fmtMS=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function pauseAll(d){for(const k in (T.tm[d]||{})){const t=T.tm[d][k];if(t.since){t.acc+=Date.now()-t.since;t.since=null}}}

// Si la app estuvo cerrada, el cronómetro se detiene en el último momento en que estuvo abierta
(function recoverTimers(){try{T.hb=+localStorage.getItem(TK+".hb")||0}catch(e){}if(!T.hb)return;const gap=Date.now()-T.hb;if(gap<120000)return;let fixed=0;
  for(const d in T.tm)for(const k in T.tm[d]){const t=T.tm[d][k];if(t.since){t.acc+=Math.max(0,T.hb-t.since);t.since=null;fixed++}}
  if(fixed)tSave(true)})();

/* ---------- conexión con el Worker ---------- */
let tBusy=false;
async function fetchTareas(extra){
  if(!syncConfigured()){tState="nocloud";return}
  if(navigator.onLine===false){tState="offline";return}
  if(tBusy)return;tBusy=true;
  tState="busy";refreshTk();
  try{
    const want=new Set([today()]);if(extra)want.add(extra);
    if(T.list[0])want.add(T.list[0].date);
    for(const x of T.list){if(want.size>=4)break;const s=T.ses[x.date];if(s&&!parseSession(s.blocks).retro.length)want.add(x.date)}
    for(const x of T.list){if(want.size>=6)break;if(!T.ses[x.date])want.add(x.date)}
    // El servidor tiene un presupuesto de llamadas a Notion por pedido: lo que no alcanza vuelve en «pending»
    // y se pide en otra vuelta (las sesiones pendientes conservan lo ya guardado mientras tanto).
    let dates=[...want],ver=null,todo=false;const recibidas=new Set();
    for(let vuelta=0;vuelta<30&&dates.length;vuelta++){
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
      const r=await fetch(DB.settings.syncUrl.replace(/\/+$/,"")+"/tareas/lista",{method:"POST",signal:ctl.signal,
        headers:{"Authorization":"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"},body:JSON.stringify({dates})});
      clearTimeout(to);
      if(r.status===401){tState="badkey";return}
      const j=await r.json();
      if(!j.ok){tState=j.error==="sin-seccion"?"nosection":"error";tErr=j.detail||j.error||"";return}
      T.list=j.list||[];
      for(const[d,blocks]of Object.entries(j.sessions||{})){const it=T.list.find(x=>x.date===d);T.ses[d]={tid:it&&it.tid,title:it?it.title:d,blocks,at:Date.now()}}
      for(const d of Object.keys(j.sessions||{}))recibidas.add(d);
      T.at=Date.now();tSave(true);registerLessons();
      dates=j.more&&Array.isArray(j.pending)?j.pending.filter(d=>!recibidas.has(d)):[];
      // Si la página de Notion cambió desde la última descarga completa, se vuelven a pedir TODAS las sesiones:
      // el instructor puede haber agregado 🎮 Juego, tablas o retroalimentación a días ya guardados.
      if(j.ver&&!ver){ver=j.ver;if(ver!==T.ver){todo=true;for(const x of T.list)if(!recibidas.has(x.date)&&!dates.includes(x.date))dates.push(x.date)}}
      if(dates.length){tState="busy";refreshTk()}
    }
    if(ver&&!dates.length){T.ver=ver;tSave(true)} // solo se marca como al día si se descargó todo
    tState="ok";
  }catch(e){tState=navigator.onLine===false?"offline":"error";tErr=e.name==="AbortError"?"sin respuesta":e.message}
  finally{tBusy=false;if(view==="tareas")renderTareas();else if(view==="tarea"){if(!document.activeElement.closest(".tk-item"))renderTarea(true)}else if(view==="ref")renderRef(true);else if(view==="mat")renderMateria();else if(view==="home"){if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("input,textarea"))refreshTk();else renderHome()}}
}
function tkLabel(){
  return {busy:"Actualizando…",offline:"Sin conexión · mostrando lo guardado",badkey:"⚠ Clave inválida (Ajustes)",nosection:"Aún no existe la sección en Notion",
    error:"⚠ No se pudo actualizar"+(tErr?": "+tErr:""),nocloud:"Configura la nube en Ajustes para recibir sesiones"}[tState]||(T.at?"Actualizado "+new Date(T.at).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}):"")}
function refreshTk(){const el=document.getElementById("tkState");if(el)el.textContent=tkLabel()}

/* ---------- inicio: tarjeta de acceso ---------- */
function tareasCard(){

/* ---------- Lecciones del juego: «### 🎮 Juego» que el instructor agrega al corregir ----------
   Formato: cada elemento de lista = pregunta; sub-elementos = opciones (exactamente una empieza con ✓);
   un sub-elemento con 💡 = explicación. Entre 2 y 4 opciones (si hay más: la correcta + 3 al azar). */
let LESSONS=[];
const san=t=>String(t).replace(/</g,"‹").replace(/>/g,"›");
function lessonItemsOf(d){
  const s=T.ses[d];if(!s)return[];
  const out=[];
  for(const b of parseSession(s.blocks).juego){
    if(!isList(b.ty))continue;
    const opts=[];let exp="";
    for(const k of b.k||[]){
      const t=nfe(rtPlain(k.r)).trim();if(!t)continue;
      if(/^💡/u.test(t)){exp=t.replace(/^💡\s*/u,"");continue}
      const ok=/^(✓|✔|✅)\s*/u.test(t);opts.push({t:san(t.replace(/^(✓|✔|✅)\s*/u,"")),ok});
    }
    const q=san(rtPlain(b.r)).trim();
    if(!q||opts.length<2||opts.filter(o=>o.ok).length!==1)continue; // mal formada: se ignora
    const right=opts.find(o=>o.ok).t;
    out.push({id:"d:"+d+":"+b.id,k:"R",c:"DIA",L:d,q,all:opts,o:[right].concat(opts.filter(o=>!o.ok).map(o=>o.t)),
      r:(exp?san(exp):"Correcta: "+right)+" · Lección del "+fechaCorta(d)});
  }
  return out;
}
function registerLessons(){
  for(const id of Object.keys(BYID))if(id.startsWith("d:"))delete BYID[id];
  LESSONS=[];
  for(const d of Object.keys(T.ses).sort().reverse())for(const it of lessonItemsOf(d)){LESSONS.push(it);BYID[it.id]=it}
}
const allItems=()=>ITEMS.concat(LESSONS);
const lessonDays=()=>[...new Set(LESSONS.map(x=>x.L))];
function modeLabel(m){
  m=String(m);
  if(m==="days")return "Todas las lecciones";
  if(m.startsWith("day:"))return "Lección · "+fechaCorta(m.slice(4))+" · "+tituloSes(m.slice(4));
  const c=CUI[m]||MODES[m];if(!c)return m;
  return c.n+(CATS[m]&&m!=="DIA"?" · "+CATS[m].n:"");
}
function lessonsHtml(f){
  const days=lessonDays();
  if(!days.length)return `<h3>📅 Lecciones de días estudiados</h3><div class="card lempty"><b>Aún no hay lecciones.</b><div class="muted small">Cada vez que el instructor corrija un día y agregue la sección «🎮 Juego», aparecerá aquí una lección nueva para jugar.</div></div>`;
  const acc=ids=>{let n=0,ok=0;for(const id of ids){const it=DB.items[id];if(it&&it.n){n+=it.n;ok+=it.ok||0}}return n?ok/n:null};
  const card=(mode,title,sub,ids,isNew)=>{const p=acc(ids);return `<button class="lesson ${f===mode?"on":""}" data-focus="${esc(mode)}">
      <span class="glyph" style="--c:var(--dia)">Día</span><span class="lt"><b>${esc(title)}</b><span class="muted small">${sub}${isNew?' · <span class="lnew">nueva</span>':""}</span></span>
      <span class="pct">${p==null?"▶":Math.round(p*100)+"%"}</span>${p!=null?`<span class="mb" style="width:${p*100}%;background:var(--dia)"></span>`:""}</button>`};
  const all=LESSONS.map(x=>x.id);
  return `<h3>📅 Lecciones de días estudiados</h3><div class="lessons">
    ${days.length>1?card("days","Todas las lecciones",`${days.length} días · ${all.length} preguntas`,all):""}
    ${days.map(d=>{const ids=LESSONS.filter(x=>x.L===d).map(x=>x.id);return card("day:"+d,tituloSes(d),`${esc(fechaCorta(d))} · ${ids.length} preguntas`,ids,!ids.some(id=>DB.items[id]))}).join("")}
  </div>`;
}

/* ---------- Materia: solo las tablas de cada clase, por día (de 📘 Consulta y de la introducción) ---------- */
function eTables(list,out){for(const b of list||[]){if(b.ty==="table")out.push(b);else if(b.k)eTables(b.k,out)}return out}
// Referencia = solo teoría escrita: cada tabla se reemplaza por un aviso (las tablas viven en Materia)
function sinTablas(list){return (list||[]).map(b=>b.ty==="table"?{ty:"paragraph",r:[{t:"(La tabla está en 📊 Materia)",i:1}]}:b.k?{...b,k:sinTablas(b.k)}:b)}
function renderMateria(){

      <textarea class="tk-note" rows="2" data-tk="note" data-v="${id}" placeholder="Nota para el instructor (en español)" ${locked?"readonly":""}>${esc(A.nt)}</textarea></div>`}

    :`<textarea class="tk-in" rows="${TLONG.has(a.ty)?3:1}" data-tk="text" data-v="${id}" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" data-enable-grammarly="false" ${locked?"readonly":""} placeholder="Escribe en inglés…">${esc(A.v)}</textarea>`;
  const kids=b.k&&b.k.length?`<div class="tk-sub">${b.k.map(blockHtml).join("")}</div>`:"";
  return `<div class="tk-item ${A.d?"doubt":""}" data-item="${id}" data-act-key="${a.key}">
    <div class="tk-q">${b.ty==="numbered_list_item"?"":"• "}${rtHtml(r)}</div>${kids}${input}
    <div class="tk-meta"><span class="seg tk-help">${[["nada","Sin ayuda"],["dic","Diccionario"],["trad","Traductor"]].map(([k,n])=>`<button class="${A.h===k?"on":""}" data-tk="help" data-v="${id}" data-h="${k}" ${locked?"disabled":""}>${n}</button>`).join("")}</span>
      <button class="tk-doubt ${A.d?"on":""}" data-tk="doubt" data-v="${id}" ${locked?"disabled":""}>❓ Tengo duda</button></div>
    <textarea class="tk-note" rows="2" data-tk="note" data-v="${id}" placeholder="Nota para el instructor (en español)" ${locked?"readonly":""}>${esc(A.nt)}</textarea>
  </div>`;
}
function actHtml(d,a,locked){
  const isTask=a.ty!=="ref";
  let body="",ol=0;
  for(const b of a.blocks){
    if(isTask&&isList(b.ty)){body+=itemHtml(d,a,b,locked);continue}
    body+=blockHtml(b);
  }
  const t=tTm(d,a.key),lim=a.ty==="mock"&&a.min?a.min*60000:0;
  const timer=isTask?`<button class="tk-timer ${t.since?"run":""}" data-tk="timer" data-v="${a.key}" data-lim="${lim}" ${locked?"disabled":""}><span data-clock="${a.key}">${lim?"⏳ "+fmtMS(lim-tEl(t)):"▶ "+fmtMS(tEl(t))}</span></button>`:"";
  const sug=a.min?`<span class="muted small">${a.ty==="mock"?"límite":"sugerido"} ${a.min} min</span>`:"";
  return `<section class="card tk-act ${a.ty==="ref"?"ref":""}" data-akey="${a.key}"><div class="tk-ah"><span class="tag">${esc(a.n)}</span>${sug}<span class="sp"></span>${timer}</div>
    <h3 class="tk-title">${esc(a.title)}</h3>${a.ty==="mastery"?`<div class="muted small" style="margin-bottom:8px">Resuélvela sin ayuda: es para medir si dominas el tema.</div>`:""}${body}</section>`;
}
function totalMin(d,p){let ms=0,oms=0;for(const a of p.acts){if(a.ty==="ref")continue;const t=tEl(tTm(d,a.key));if(a.ty==="out")oms+=t;else ms+=t}
  const app=Math.round(ms/60000),out=Math.round(oms/60000);return{app,out,total:Math.round((ms+oms)/60000)}}
function hydrateFromEntrega(d){
  const last=entregasDe(d).pop();if(!last||Object.keys(T.ans[d]||{}).length)return;
  for(const a of last.acts||[])for(const it of a.items||[]){if(!it.id)continue;
    if(a.out){tOut(d,it.id).done=!!it.done;Object.assign(tAns(d,it.id),{d:it.d?1:0,nt:it.nt||""})}
    else Object.assign(tAns(d,it.id),{v:it.v||"",ch:it.ch||null,d:it.d?1:0,nt:it.nt||"",h:it.h||"nada",s:it.s||0})}
  tSave(true);
}

      <button class="btn" data-tk="copy">📋 Copiar respuestas</button>${locked?"":`<button class="btn tk-send" data-tk="send">📤 Entregar</button>`}</div>

/* ---------- entrega ---------- */
function buildEntrega(d){
  const s=T.ses[d],p=parseSession(s.blocks),m=totalMin(d,p);let dudas=0;
  const acts=p.acts.filter(a=>a.ty!=="ref").map(a=>{
    const items=a.blocks.filter(b=>isList(b.ty)).map(b=>{
      const A=tAns(d,b.id);if(A.d)dudas++;
      if(a.ty==="out"){const o=tOut(d,b.id);return{id:b.id,p:rtPlain(b.r),done:!!o.done,d:A.d?1:0,nt:A.nt}}
      const{r,opts}=splitOpts(b.r||[]);
      return{id:b.id,p:rtPlain(r)+(opts?` {${opts.join(" | ")}}`:""),v:A.v,ch:A.ch,s:Math.round(A.s),d:A.d?1:0,nt:A.nt,h:A.h};
    });
    const sec=Math.round(tEl(tTm(d,a.key))/1000);
    return{title:a.title&&a.title!==a.n?`${a.n}: ${a.title}`:a.n,ty:a.ty,sec,min:Math.round(sec/60),lim:a.ty==="mock"?a.min:null,out:a.ty==="out"?1:0,items};
  });
  const now=new Date(),off=-now.getTimezoneOffset(),pad=x=>String(Math.abs(x)).padStart(2,"0");
  const iso=today(now)+"T"+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds())+(off>=0?"+":"-")+pad(Math.trunc(off/60))+":"+pad(off%60);
  return{t:now.getTime(),k:"t",date:d,tid:s.tid,n:entregasDe(d).length+1,iso,dn:DB.dev.name,min:m.total,dudas,acts};
}
const HELPN={nada:"sin ayuda",dic:"diccionario",trad:"traductor"};
function entregaMd(e){
  const L=[`## 📤 Entrega ${e.n} — ${e.date} · ${e.min} min · ${e.dudas} ${e.dudas===1?"duda":"dudas"}`];
  for(const a of e.acts){L.push("",`### ${a.title} · ${a.sec!=null?fmtMS(a.sec*1000):a.min+" min"}${a.lim?" / límite "+a.lim+" min":""}`);
    a.items.forEach((it,i)=>{
      if(a.out){L.push(`- [${it.done?"x":" "}] ${it.p} — ${it.done?"hecho":"no hecho"}`);if(it.d)L.push(`   ❓ Duda: ${it.nt||"(sin nota)"}`);return}
      const ans=it.ch?`[${it.ch}]${it.v?" "+it.v:""}`:(it.v||"(sin respuesta)");
      L.push(`${i+1}. ${it.p}`,...ans.split("\n").map(x=>"   > "+x),`   _⏱ ${it.s} s · ${HELPN[it.h]||"sin ayuda"}_`);
      if(it.d)L.push(`   ❓ Duda: ${it.nt||"(sin nota)"}`);
    })}
  return L.join("\n");
}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}}
function sendEntrega(){
  const d=tDate,s=T.ses[d];if(!s)return;
  pauseAll(d);
  const e=buildEntrega(d),n=e.acts.reduce((x,a)=>x+(a.out?0:a.items.length),0),empty=e.acts.reduce((x,a)=>x+(a.out?0:a.items.filter(i=>!i.v&&!i.ch).length),0);
  if(!confirm(`¿Entregar la sesión del ${d}?\n\n${n} respuestas${empty?` (${empty} vacías)`:""} · ${e.dudas} ${e.dudas===1?"duda":"dudas"} · ${e.min} min${e.n>1?`\n\nSerá la entrega ${e.n}; las anteriores no se borran.`:""}`)){tSave();return renderTarea(true)}
  addLocal(e);save();T.edit[d]=false;tSave(true);
  toast(syncConfigured()?(navigator.onLine===false?"Entrega guardada: se enviará al volver la conexión":"📤 Entregada"):"Entrega guardada. Configura la nube para que llegue a Notion; mientras, usa «Copiar respuestas».");
  renderTarea();syncNow();
}

function exportData(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(persisted())],{type:"application/json"}));
  a.download=`mext-forge-respaldo-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
}
$("#imp").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&d.v===2&&Array.isArray(d.ev)){const have=new Set(DB.ev.map(e=>e.i));for(const e of d.ev)if(!have.has(e.i)){DB.ev.push(e);DB.outbox.push(e.i)}}
    else if(d&&d.cats){const e={t:1,k:"b",snap:legacySnap(d)};e.i=DB.dev.id+"-imp-"+rid();e.d=DB.dev.id;DB.ev.push(e);DB.outbox.push(e.i)}
    else throw 0;
    rebuild();save();render();toast("Respaldo importado y fusionado");syncNow()}catch(err){toast("Archivo no válido")}};
  r.readAsText(f);e.target.value=""});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act]");
  if(!t)return;
  const d=t.dataset;
  if(d.ans!==undefined){if(G&&G.state==="q")answer(+d.ans);return}
  if(d.focus){DB.settings.focus=d.focus;save();renderHome();return}
  if(d.focusGo){start(d.focusGo);return}
  if(d.mode){start(d.mode);return}
  if(d.speed){DB.settings.speed=d.speed;save();render();return}
  if(d.mute){DB.settings.mute=d.mute==="1";save();render();return}
  if(d.theme){DB.settings.theme=d.theme;save();render();return}
  if(d.dev){DB.dev.name=d.dev;save();render();return}
  switch(d.act){
    case "go":start(DB.settings.focus);break;
    case "again":start(G.key);break;
    case "cont":cont();break;
    case "quit":quit();break;
    case "home":quit();break;
    case "stats":view="stats";render();break;
    case "export":exportData();break;
    case "import":$("#imp").click();break;
    case "reset":if(confirm(syncConfigured()?"¿Borrar el progreso de ESTE dispositivo? Lo que ya está en la nube se volverá a descargar al sincronizar.":"¿Borrar todo el progreso, buffer y estadísticas? Exporta un respaldo antes si lo quieres conservar.")){const keep=DB.settings;DB=fresh();DB.settings=keep;derivedReset(DB);save();render();toast("Progreso borrado");syncNow()}break;
    case "syncpill":{const det=document.querySelector("details.card");if(!syncConfigured()&&det){det.open=true;det.scrollIntoView({behavior:"smooth"})}else syncNow(true);break}
    case "syncsave":DB.settings.syncUrl=$("#sUrl").value.trim();DB.settings.syncKey=$("#sKey").value.trim();save();
      if(!syncConfigured()){toast("Sincronización desactivada");render()}else syncNow(true);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("summary,input,textarea"))return;
  if(view==="tareas"||view==="tarea"||view==="ref"||view==="mat"){if(e.key==="Escape"){if(view==="tarea"||view==="ref"||view==="mat"){if(view==="tarea"){addItemTime();pauseAll(tDate);tSave(true)}view="tareas";renderTareas()}else quit()}return}
  const k=e.key.toLowerCase();
  if(e.key==="Escape"){quit();return}
  if(view==="home"){if(e.key==="Enter"){e.preventDefault();start(DB.settings.focus)}else if(k==="s"){view="stats";render()}return}
  if(view==="stats"){return}
  if(view==="end"){if(e.key==="Enter"){e.preventDefault();start(G.key)}return}
  if(view==="drill"&&G){
    if(G.state==="q"){
      let i=-1;if(k.length===1&&"1234".includes(k))i=+k-1;else if(k.length===1&&"abcd".includes(k))i="abcd".indexOf(k);
      const max=G.it.k==="E"?4:G.it.o.length;
      if(i>=0&&i<max){e.preventDefault();answer(i)}
    }else if(e.key==="Enter"||e.key===" "){e.preventDefault();cont()}
  }
});

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  const hadSW = !!navigator.serviceWorker.controller;
  let pending = false, done = false;
  const busy = () => typeof view !== "undefined" && (view === "drill" || view === "tarea");
  const reloadNow = () => { if (done) return; done = true; location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadSW) return; if (busy()) pending = true; else reloadNow(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (pending && !busy()) return reloadNow();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  });
  document.addEventListener("click", () => { if (pending && !busy()) setTimeout(() => { if (!busy()) reloadNow(); }, 50); });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
